# QuantOS local stack.
#
# `make dev` brings this up. It is the compose profile from
# docs/architecture/overview.md: the same engines as production, with
# PostgreSQL, ClickHouse, Redis and the observability trio behind them.
#
# Kafka is present so the split topology can be exercised locally. The Go
# services use the durable WAL bus driver by default (see ADR-002 and
# drivers/kafka/README.md); point bus.driver at kafka once that module is built.

name: quantos

x-service: &service
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  environment: &service-env
    QUANTOS_CONFIG: /etc/quantos/quantos.compose.yaml
    QUANTOS_MODE: compose
    QUANTOS_JWT_SECRET: local-development-secret-not-for-production-use-01234
    QUANTOS_POSTGRES_DSN: postgres://quantos:quantos@postgres:5432/quantos?sslmode=disable
    QUANTOS_CLICKHOUSE_URL: http://clickhouse:8123
    QUANTOS_CLICKHOUSE_USER: quantos
    QUANTOS_CLICKHOUSE_PASSWORD: quantos
    QUANTOS_REDIS_ADDR: redis:6379
    QUANTOS_OTLP_ENDPOINT: http://otel-collector:4318
    QUANTOS_LOG_FORMAT: json
  volumes:
    - ../config:/etc/quantos:ro
    - ../strategies:/app/strategies:ro
    - ../ml/artifacts:/app/ml/artifacts:ro
    - wal:/var/lib/quantos/wal
  depends_on:
    postgres: {condition: service_healthy}
    clickhouse: {condition: service_healthy}
    redis: {condition: service_healthy}
  networks: [quantos]

services:
  # ------------------------------------------------------------- data ------
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: quantos
      POSTGRES_PASSWORD: quantos
      POSTGRES_DB: quantos
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/postgres:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quantos -d quantos"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [quantos]

  clickhouse:
    image: clickhouse/clickhouse-server:24.8-alpine
    environment:
      CLICKHOUSE_USER: quantos
      CLICKHOUSE_PASSWORD: quantos
      CLICKHOUSE_DB: quantos
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    ports: ["8123:8123", "9000:9000"]
    ulimits:
      nofile: {soft: 262144, hard: 262144}
    volumes:
      - chdata:/var/lib/clickhouse
      - ./sql/clickhouse:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8123/ping || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [quantos]

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory", "512mb", "--maxmemory-policy", "allkeys-lru"]
    ports: ["6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [quantos]

  # KRaft-mode Kafka: no ZooKeeper, one broker, adequate for a laptop.
  kafka:
    image: bitnami/kafka:3.7
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_CFG_NUM_PARTITIONS: "12"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports: ["9092:9092"]
    volumes: [kafkadata:/bitnami/kafka]
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20
    networks: [quantos]

  # Creates the topic set from the specification in internal/bus. Runs once.
  kafka-init:
    image: bitnami/kafka:3.7
    depends_on:
      kafka: {condition: service_healthy}
    entrypoint: ["/bin/bash", "/scripts/create-topics.sh"]
    volumes:
      - ./kafka/create-topics.sh:/scripts/create-topics.sh:ro
    restart: "no"
    networks: [quantos]

  # ---------------------------------------------------- observability ------
  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=7d
      - --web.enable-lifecycle
    ports: ["9091:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - promdata:/prometheus
    networks: [quantos]

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
    ports: ["3001:3000"]
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafanadata:/var/lib/grafana
    depends_on: [prometheus]
    networks: [quantos]

  jaeger:
    image: jaegertracing/all-in-one:1.60
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports: ["16686:16686"]
    networks: [quantos]

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.108.0
    command: ["--config=/etc/otel/config.yaml"]
    volumes:
      - ./otel/config.yaml:/etc/otel/config.yaml:ro
    ports: ["4317:4317", "4318:4318"]
    depends_on: [jaeger]
    networks: [quantos]

  # ------------------------------------------------------- platform --------
  market-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: market-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: market-service
      QUANTOS_HTTP_ADDR: ":8081"
    ports: ["8081:8081"]

  signal-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: signal-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: signal-service
      QUANTOS_HTTP_ADDR: ":8082"
    ports: ["8082:8082"]

  risk-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: risk-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: risk-service
      QUANTOS_HTTP_ADDR: ":8083"
    ports: ["8083:8083"]

  portfolio-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: portfolio-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: portfolio-service
      QUANTOS_HTTP_ADDR: ":8084"
    ports: ["8084:8084"]

  news-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: news-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: news-service
      QUANTOS_HTTP_ADDR: ":8085"
    ports: ["8085:8085"]

  evaluation-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: evaluation-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: evaluation-service
      QUANTOS_HTTP_ADDR: ":8086"
    ports: ["8086:8086"]

  alert-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: alert-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: alert-service
      QUANTOS_HTTP_ADDR: ":8087"
    ports: ["8087:8087"]

  backtest-service:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: backtest-service}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: backtest-service
      QUANTOS_HTTP_ADDR: ":8088"
    ports: ["8088:8088"]

  api-gateway:
    <<: *service
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args: {SERVICE: api-gateway}
    environment:
      <<: *service-env
      QUANTOS_SERVICE: api-gateway
      QUANTOS_HTTP_ADDR: ":8080"
    ports: ["8080:8080"]

volumes:
  pgdata:
  chdata:
  redisdata:
  kafkadata:
  promdata:
  grafanadata:
  wal:

networks:
  quantos:
    driver: bridge
