# Dependency updates.
#
# The security workflow tells us when the world changed under a commit that was
# fine yesterday; this file is what opens the pull request that fixes it, so a
# red scheduled run is followed by a ready-made bump rather than an
# investigation. Updates are grouped per ecosystem so a week of churn is one PR
# to review, not twenty. Security updates are not grouped or delayed: each one
# arrives as soon as GitHub publishes the advisory.
#
# Major versions (and Go minor versions) are ignored on purpose. They are
# migrations, not bumps -- Tailwind 3 to 4 moves its PostCSS plugin to another
# package, Go 1.27.0 shipped with HIGH stdlib CVEs fixed only in 1.27.2 -- and
# a pull request that can only go green after a hand-written migration is noise
# in the queue. Those upgrades are made deliberately, in their own change.
version: 2

updates:
  - package-ecosystem: gomod
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(go)" }
    groups:
      go-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: docker
    # The golang build image. Its tag carries the Go patch release, which is
    # also what the standard library inside every binary is; see the policy
    # check in security.yml that keeps it at or above go.mod's toolchain line.
    directory: /deploy
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    commit-message: { prefix: "deps(docker)" }
    ignore:
      # Patch releases only (1.26.9 -> 1.26.10). Moving to a new Go minor also
      # moves go.mod's go and toolchain lines, so it is done by hand.
      - dependency-name: golang
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    commit-message: { prefix: "deps(actions)" }
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    schedule: { interval: weekly, day: monday, time: "06:00", timezone: America/New_York }
    open-pull-requests-limit: 5
    commit-message: { prefix: "deps(frontend)" }
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      frontend-minor-patch:
        update-types: [minor, patch]

  - package-ecosystem: pip
    directory: /ml
    schedule: { interval: monthly }
    # requirements.txt holds minimum versions (numpy>=1.24), and CI installs the
    # newest release that supports its Python. Raising a floor to the latest
    # release only breaks that: numpy 2.5 needs Python 3.12 and CI runs 3.11.
    # Floors move when an advisory demands it, which is what this does.
    versioning-strategy: increase-if-necessary
    commit-message: { prefix: "deps(ml)" }
    groups:
      ml:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /infra/terraform/environments/*
      - /infra/terraform/modules/*
    schedule: { interval: monthly }
    commit-message: { prefix: "deps(terraform)" }
    groups:
      terraform:
        patterns: ["*"]
