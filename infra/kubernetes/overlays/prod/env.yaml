# Production environment values.
#
# The bucket comes from `terraform output -json s3_buckets` in
# infra/terraform/environments/prod. QUANTOS_SEED is deliberately absent: prod
# takes the seed from config, and pinning it here would make two environments
# that are supposed to differ look identical in a diff.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantos-env
data:
  QUANTOS_ENV: prod
  QUANTOS_LOG_LEVEL: info
  MODEL_BUCKET: quantos-prod-222222222222-models
  QUANTOS_CLICKHOUSE_URL: http://clickhouse.quantos.svc.cluster.local:8123
