# Priority class assignment.
#
# Live path first, batch last. See priorityclass.yaml for why this is explicit
# rather than left to the kubelet's QoS heuristic.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  template:
    spec:
      priorityClassName: quantos-live
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: market-service
spec:
  template:
    spec:
      priorityClassName: quantos-live
