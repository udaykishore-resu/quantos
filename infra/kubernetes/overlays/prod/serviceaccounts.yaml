# IRSA role ARNs from `terraform output -json service_role_arns` in
# infra/terraform/environments/prod.
#
# Patched here rather than templated in the base because the account id is the
# one value that must never be guessed: a wrong id produces an
# AssumeRoleWithWebIdentity failure, and a right-but-different id produces
# someone else's permissions.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-api-gateway
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/quantos-prod-api-gateway
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-market-service
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::222222222222:role/quantos-prod-market-service
---
