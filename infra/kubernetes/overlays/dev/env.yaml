# Dev environment values.
#
# QUANTOS_LOG_LEVEL is debug because the thing dev is for is reading what
# happened. The bucket name comes from `terraform output -json s3_buckets`.
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantos-env
data:
  QUANTOS_ENV: dev
  QUANTOS_LOG_LEVEL: debug
  # Deterministic tick stream. The same seed as config/quantos.yaml, so a dev
  # run and a `make demo` run see the same market.
  QUANTOS_SEED: "20260827"
  MODEL_BUCKET: quantos-dev-111111111111-models
