# Dev secret paths.
#
# The Secrets Manager names are prefixed with the environment (modules/data uses
# `${var.name}/...` and var.name is `quantos-dev`), so the remote refs differ
# per environment even though the projected Secret names do not.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-store
spec:
  data:
    - secretKey: QUANTOS_POSTGRES_DSN
      remoteRef:
        key: quantos-dev/postgres
        property: dsn
    - secretKey: QUANTOS_REDIS_ADDR
      remoteRef:
        key: quantos-dev/redis
        property: addr
    - secretKey: QUANTOS_JWT_SECRET
      remoteRef:
        key: quantos-dev/jwt-signing-key
        property: secret
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-bus
spec:
  data:
    - secretKey: QUANTOS_KAFKA_BROKERS
      remoteRef:
        key: quantos-dev/kafka
        property: bootstrap_brokers
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-llm
spec:
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: quantos-dev/llm-api-key
        property: api_key
