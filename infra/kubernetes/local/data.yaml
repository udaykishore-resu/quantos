# The backing stores, in-cluster, sized for a laptop.
#
# These exist only in the local overlay. In cluster mode they are RDS,
# ElastiCache and a managed ClickHouse (infra/terraform), and a StatefulSet
# pretending to be a managed database is a good way to learn the wrong lessons
# about operating one. What they are here for is to make the `compose` runtime
# mode reachable on a laptop: the SQL store, the analytical store and the cache
# are the three things the embedded mode does not exercise at all.
#
# Every one of them is deliberately unhardened — one replica, no backups, a
# password committed in plain text. That is acceptable precisely because it is
# unreachable from outside the cluster and holds nothing but simulated market
# data. It is not a starting point for anything else.
---
apiVersion: v1
kind: Secret
metadata:
  name: quantos-local-credentials
  labels:
    app.kubernetes.io/part-of: quantos
    app.kubernetes.io/component: local-only
type: Opaque
stringData:
  # A local-only credential set. The cluster overlays take these from
  # ExternalSecrets backed by Secrets Manager; nothing here is a template for
  # that, and a value in this file must never appear in a real deployment.
  POSTGRES_USER: quantos
  POSTGRES_PASSWORD: quantos
  POSTGRES_DB: quantos
  CLICKHOUSE_USER: quantos
  CLICKHOUSE_PASSWORD: quantos
  QUANTOS_POSTGRES_DSN: postgres://quantos:quantos@postgres:5432/quantos?sslmode=disable
  QUANTOS_CLICKHOUSE_URL: http://clickhouse:8123
  QUANTOS_CLICKHOUSE_USER: quantos
  QUANTOS_CLICKHOUSE_PASSWORD: quantos
  QUANTOS_REDIS_ADDR: redis:6379
  QUANTOS_JWT_SECRET: local-development-secret-not-for-production-use-01234

---
# --------------------------------------------------------------- postgres ---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: quantos
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/part-of: quantos
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/part-of: quantos
    spec:
      securityContext:
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        # PostgreSQL is the one workload here that is not hardened further.
        # Its entrypoint starts as root to create and chown the data directory
        # and then drops to the postgres user, so it needs CHOWN, SETUID and
        # SETGID: dropping all capabilities makes initdb fail with a permission
        # error that reads like a volume problem. Left as the image intends,
        # deliberately, rather than half-hardened into something that breaks.
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          envFrom:
            - secretRef:
                name: quantos-local-credentials
          env:
            # The image's initdb only runs the scripts in
            # /docker-entrypoint-initdb.d when the data directory is empty, and
            # PGDATA must be a subdirectory of the mount or initdb refuses to
            # run against the lost+found some volumes come with.
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: schema
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "quantos", "-d", "quantos"]
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 30
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "quantos", "-d", "quantos"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: "1", memory: 1Gi}
      volumes:
        # The schema arrives as a ConfigMap generated by kustomize from
        # deploy/sql/postgres, so the cluster applies exactly the file the
        # compose stack does rather than a second copy that can drift.
        - name: schema
          configMap:
            name: postgres-schema
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi

---
# ------------------------------------------------------------- clickhouse ---
apiVersion: v1
kind: Service
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: quantos
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: clickhouse
  ports:
    - name: http
      port: 8123
      targetPort: 8123
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  labels:
    app.kubernetes.io/name: clickhouse
    app.kubernetes.io/part-of: quantos
spec:
  serviceName: clickhouse
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: clickhouse
  template:
    metadata:
      labels:
        app.kubernetes.io/name: clickhouse
        app.kubernetes.io/part-of: quantos
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: clickhouse
          image: clickhouse/clickhouse-server:24.8-alpine
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - name: http
              containerPort: 8123
          env:
            - name: CLICKHOUSE_USER
              value: quantos
            - name: CLICKHOUSE_PASSWORD
              value: quantos
            - name: CLICKHOUSE_DB
              value: quantos
            # Without this the server refuses to let a non-default user run the
            # DDL in the schema, and the init job fails with a permissions error
            # that reads like a bug.
            - name: CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
          readinessProbe:
            httpGet:
              path: /ping
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            failureThreshold: 30
          resources:
            requests: {cpu: 200m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 4Gi

---
# ------------------------------------------------------------------ redis ---
apiVersion: v1
kind: Service
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: quantos
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: redis
  ports:
    - name: redis
      port: 6379
      targetPort: 6379
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: redis
  labels:
    app.kubernetes.io/name: redis
    app.kubernetes.io/part-of: quantos
spec:
  serviceName: redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: redis
        app.kubernetes.io/part-of: quantos
    spec:
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: redis
          image: redis:7-alpine
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # No persistence. Redis holds the read cache, the deduplication set
          # and the rate-limit buckets — all of it reconstructible, none of it
          # a source of truth. Writing it to disk on a laptop buys nothing.
          args: ["--save", "", "--appendonly", "no", "--maxmemory", "256mb",
                 "--maxmemory-policy", "allkeys-lru"]
          ports:
            - name: redis
              containerPort: 6379
          readinessProbe:
            exec:
              command: ["redis-cli", "ping"]
            initialDelaySeconds: 3
            periodSeconds: 5
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 320Mi}

---
# ---------------------------------------------- ClickHouse schema init job ---
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-schema
  labels:
    app.kubernetes.io/part-of: quantos
    app.kubernetes.io/component: init
spec:
  backoffLimit: 10
  template:
    metadata:
      labels:
        app.kubernetes.io/part-of: quantos
        app.kubernetes.io/component: init
    spec:
      restartPolicy: OnFailure
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: apply
          image: clickhouse/clickhouse-server:24.8-alpine
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          # PostgreSQL applies its schema through the image's own initdb hook;
          # ClickHouse has no equivalent, so it gets a job. `--multiquery` is
          # required: the file is a sequence of statements, and without it only
          # the first one runs and the rest are silently ignored.
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              echo "waiting for clickhouse..."
              for _ in $(seq 1 60); do
                if clickhouse-client --host clickhouse --user quantos --password quantos \
                     --query "SELECT 1" >/dev/null 2>&1; then break; fi
                sleep 2
              done
              clickhouse-client --host clickhouse --user quantos --password quantos \
                --multiquery < /schema/001_schema.sql
              echo "clickhouse schema applied"
          volumeMounts:
            - name: schema
              mountPath: /schema
              readOnly: true
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
      volumes:
        - name: schema
          configMap:
            name: clickhouse-schema
