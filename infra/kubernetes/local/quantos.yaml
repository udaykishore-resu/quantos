# QuantOS itself, running every role in one process.
#
# This is not the topology the base manifests describe, and the difference is
# worth understanding rather than working around.
#
# The base splits the platform into nine Deployments, one per role. That split
# needs a broker: the roles publish to each other, and a consumer in another
# pod has to be able to read what a producer wrote. The WAL driver cannot do
# that — it serialises appends with an in-process mutex and keeps its own
# record-offset counter, so a second writer interleaves partial records and
# reuses offsets. It now refuses to start rather than corrupt the log
# (internal/bus.acquireDirLock), which is why nine pods sharing a volume would
# fail loudly instead of quietly.
#
# The broker driver, drivers/kafka, is not written. Until it is, the honest
# local deployment is the one below: a single process running all six roles,
# against real PostgreSQL, real ClickHouse and real Redis. That exercises
# everything the embedded mode does not — SQL persistence, the analytical
# store, Redis-backed rate limiting and deduplication, and the provenance gate
# that suspends signal emission when the store cannot be written — which is the
# whole reason to run this in a cluster rather than with `make run`.
#
# The nine-service manifests stay in infra/kubernetes/base, ready for the day
# the broker exists. Deploying them now would produce nine pods that cannot
# talk to each other, which looks like a working system and is not one.
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantos-local-config
  labels:
    app.kubernetes.io/part-of: quantos
data:
  quantos.local.yaml: |
    # An override sheet, not a complete configuration: internal/config.Default()
    # supplies everything absent. Mounted at /etc/quantos/quantos.local.yaml and
    # selected with QUANTOS_CONFIG.
    env: local
    mode: compose

    log:
      level: info
      format: json

    http:
      addr: ":8080"

    telemetry:
      # No collector in the local cluster. Traces are still generated and
      # sampled; they simply have nowhere to go, which is better than a
      # start-up failure over a missing sidecar.
      otlp_endpoint: ""
      metrics_addr: ":9090"

    bus:
      # Single process, so the WAL driver is correct here rather than a
      # compromise. Its directory is an emptyDir: the log is a buffer between
      # roles in one process, not a system of record — PostgreSQL is that.
      driver: wal
      dir: /var/lib/quantos/wal

    store:
      driver: sql

    market:
      provider: sim

    llm:
      # Deterministic mock. A local cluster must never hold a provider key.
      provider: mock

---
apiVersion: v1
kind: Service
metadata:
  name: quantos
  labels:
    app.kubernetes.io/name: quantos
    app.kubernetes.io/part-of: quantos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: quantos
  ports:
    - name: http
      port: 8080
      targetPort: http

---
# A second Service with a NodePort, so kind's extraPortMappings can reach the
# API without an ingress controller. Kept separate from the ClusterIP Service
# above so that in-cluster traffic and the laptop's route in are independently
# describable.
apiVersion: v1
kind: Service
metadata:
  name: quantos-nodeport
  labels:
    app.kubernetes.io/name: quantos
    app.kubernetes.io/part-of: quantos
    app.kubernetes.io/component: local-only
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: quantos
  ports:
    - name: http
      port: 8080
      targetPort: http
      nodePort: 30080

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: quantos
  labels:
    app.kubernetes.io/name: quantos
    app.kubernetes.io/part-of: quantos
    app.kubernetes.io/component: platform
spec:
  # One, and it must stay one. Two replicas would be two processes competing
  # for the same WAL directory; the second would refuse to start, which is the
  # correct behaviour and still a broken deployment.
  replicas: 1
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: quantos
  strategy:
    # Recreate, not RollingUpdate: a rolling update briefly runs two pods, and
    # the incoming one cannot take the WAL lock while the outgoing one holds
    # it. Accepting a few seconds of downtime is the honest trade for a
    # single-writer log.
    type: Recreate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantos
        app.kubernetes.io/part-of: quantos
        app.kubernetes.io/component: platform
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      # cli.Main installs a SIGTERM handler and drains; give it more than the
      # 15s http.shutdown_timeout so the drain finishes before SIGKILL.
      terminationGracePeriodSeconds: 45
      initContainers:
        # The platform fails start-up if it cannot reach PostgreSQL, and a
        # CrashLoopBackOff while the database finishes initialising is a
        # confusing first thing to see. Waiting here makes the ordering
        # explicit instead of implicit in a restart count.
        - name: wait-for-postgres
          image: postgres:16-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              until pg_isready -h postgres -U quantos -d quantos; do
                echo "waiting for postgres..."
                sleep 2
              done
              # The schema is applied by the postgres image's initdb hook, which
              # finishes after pg_isready first succeeds. Wait for a table the
              # platform actually needs rather than assuming.
              until psql "postgres://quantos:quantos@postgres:5432/quantos?sslmode=disable" \
                    -tAc "SELECT to_regclass('public.signals')" | grep -q signals; do
                echo "waiting for the schema..."
                sleep 2
              done
          securityContext:
            runAsNonRoot: true
            runAsUser: 65532
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {cpu: 200m, memory: 128Mi}
      containers:
        - name: quantos
          # Built from deploy/Dockerfile with SERVICE=quantos, which selects
          # cmd/quantos rather than one of the nine role binaries.
          image: quantos/quantos:local
          # Never: the image is loaded into the node by `kind load`, and there
          # is no registry to fall back to. IfNotPresent would silently try to
          # pull and fail with ImagePullBackOff on a typo in the tag.
          imagePullPolicy: Never
          # `run` is a subcommand of the multiplexer, not a flag; the roles
          # default to app.AllRoles when none are named.
          args: ["run", "-config", "/etc/quantos/quantos.local.yaml"]
          ports:
            # /metrics is served on this same port: internal/api.Mount registers
            # it on the main router and telemetry.metrics_addr starts no second
            # listener.
            - name: http
              containerPort: 8080
              protocol: TCP
          env:
            - name: QUANTOS_SERVICE
              value: quantos
            - name: QUANTOS_HTTP_ADDR
              value: ":8080"
          envFrom:
            - secretRef:
                name: quantos-local-credentials
          livenessProbe:
            # /healthz answers "the process is up". It reports degraded
            # subsystems in the body but still returns 200, so a degraded
            # platform is not killed — degradation is a state this system is
            # designed to run in, not a crash.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # /readyz answers "this instance can serve its purpose", and returns
            # 503 when the universe is empty, no strategies loaded, or
            # App.CanEmitSignals is false — that last one being the case where
            # the provenance store is unwritable and signal emission is
            # suspended. Taking the pod out of the Service makes the
            # suppression visible rather than silent.
            httpGet: {path: /readyz, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # Warm-up replays features.warmup_bars of history per symbol before
            # the first live bar. At 115 instruments that takes tens of seconds
            # on a laptop; without this probe the readiness failures during
            # warm-up would restart the pod in a loop.
            httpGet: {path: /healthz, port: http}
            periodSeconds: 5
            failureThreshold: 60
          resources:
            requests: {cpu: 500m, memory: 512Mi}
            limits: {cpu: "2", memory: 2Gi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/quantos
              readOnly: true
            - name: wal
              mountPath: /var/lib/quantos/wal
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: quantos-local-config
        # The root filesystem is read-only, so everything the process writes
        # needs an explicit volume. The WAL is an emptyDir rather than a PVC
        # because it is a buffer between roles in one process: losing it on a
        # restart costs nothing that PostgreSQL does not already hold.
        - name: wal
          emptyDir: {}
        - name: tmp
          emptyDir: {}
