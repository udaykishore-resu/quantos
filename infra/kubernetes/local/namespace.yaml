# The namespace, with Pod Security Admission enforcing `baseline` and warning
# on `restricted`.
#
# The QuantOS pod itself satisfies `restricted` — non-root, read-only root
# filesystem, no privilege escalation, all capabilities dropped, a seccomp
# profile. Enforcing it namespace-wide would still be wrong here, because the
# namespace also holds PostgreSQL, whose entrypoint starts as root to
# initialise the data directory before dropping to the postgres user. Under
# `restricted` it is rejected before it ever runs.
#
# Enforcement is therefore `baseline`, with `restricted` left on warn and audit
# so the gap stays visible in kubectl output rather than being quietly
# forgotten. This is a property of the local stack only: in cluster mode the
# databases are RDS and ElastiCache and do not run in the cluster at all, which
# is why infra/kubernetes/base can and does enforce `restricted`.
apiVersion: v1
kind: Namespace
metadata:
  name: quantos
  labels:
    app.kubernetes.io/part-of: quantos
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
