# signal-service
#
# RoleEngine. The decision path: features, regime, rules, prediction, risk,
# scoring, opportunity, signal.
#
# Scales with partition count, not with CPU: market.bars has 12 partitions
# (ADR-002) and per-symbol ordering means one partition is processed by one
# consumer, so twelve replicas is the ceiling at which adding pods stops
# helping. The HPA is keyed on consumer lag for the same reason
# (docs/operations/slo.md).
#
# Generated from one table with the other eight (ADR-011: the binaries differ
# only in which roles they name), then committed. Edit this file, not a
# generator.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: signal-service
  labels:
    app.kubernetes.io/name: signal-service
    app.kubernetes.io/part-of: quantos
    app.kubernetes.io/component: platform
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app.kubernetes.io/name: signal-service
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/name: signal-service
        app.kubernetes.io/part-of: quantos
        app.kubernetes.io/component: platform
    spec:
      serviceAccountName: quantos-signal-service
      automountServiceAccountToken: true
      # Distroless nonroot is uid 65532 (deploy/Dockerfile).
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      nodeSelector:
        quantos.io/pool: platform
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: signal-service
      # cli.Main installs a SIGTERM handler and drains; give it more than the
      # 15s http.shutdown_timeout so the drain finishes before SIGKILL.
      terminationGracePeriodSeconds: 45
      initContainers:
        # Model artifacts are versioned in S3 and pulled once at start-up rather
        # than baked into the image: a model promotion should not require a
        # rebuild of nine images. The IRSA role for this ServiceAccount grants
        # read on the models bucket only.
        - name: fetch-models
          image: public.ecr.aws/aws-cli/aws-cli:2.17.0
          command:
            - /bin/sh
            - -c
            - >-
              aws s3 sync "s3://${MODEL_BUCKET}/${MODEL_ID}/" /var/lib/quantos/models/
              --only-show-errors
          env:
            - name: MODEL_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: quantos-env
                  key: MODEL_BUCKET
            - name: MODEL_ID
              valueFrom:
                configMapKeyRef:
                  name: quantos-env
                  key: MODEL_ID
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 65532
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 500m, memory: 256Mi}
          volumeMounts:
            - name: models
              mountPath: /var/lib/quantos/models
            - name: tmp
              mountPath: /tmp
      containers:
        - name: signal-service
          # Overwritten by the kustomize images: transformer. deploy/Dockerfile
          # builds one image per service from the same multi-stage build.
          image: quantos/signal-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            # /metrics is served on this same port: internal/api.Mount registers
            # it on the main router, and telemetry.metrics_addr starts no second
            # listener. deploy/prometheus/prometheus.yml scrapes the same way.
            - name: http
              containerPort: 8082
              protocol: TCP
          env:
            - name: QUANTOS_SERVICE
              value: signal-service
            - name: QUANTOS_HTTP_ADDR
              value: ":8082"
            - name: QUANTOS_LLM_PROVIDER
              value: anthropic
          envFrom:
            # QUANTOS_CONFIG, QUANTOS_MODE, QUANTOS_ENV, QUANTOS_LOG_* and the
            # model-artifact coordinates. Non-secret, patched per overlay.
            - configMapRef:
                name: quantos-env
            # QUANTOS_POSTGRES_DSN, QUANTOS_REDIS_ADDR, QUANTOS_JWT_SECRET.
            - secretRef:
                name: quantos-store
            # QUANTOS_KAFKA_BROKERS.
            - secretRef:
                name: quantos-bus
            # ANTHROPIC_API_KEY, named by llm.api_key_env. Mounted here and in
            # no other Deployment.
            - secretRef:
                name: quantos-llm
          livenessProbe:
            # /healthz answers "the process is up". It reports degraded
            # subsystems in the body but still returns 200, so a degraded
            # service is not killed - degradation is a state this platform is
            # designed to run in, not a crash.
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            # /readyz answers "this instance can serve its purpose", and returns
            # 503 when the universe is empty, no strategies loaded, or
            # App.CanEmitSignals is false. That last one is the important case:
            # when the provenance store is unwritable the platform suspends
            # emission, and this probe takes the pod out of the Service so the
            # suppression is visible rather than silent.
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          startupProbe:
            # Feature warm-up reads history before the first bar
            # (features.warmup_bars). Until it finishes the service is not
            # ready, and without this the readiness failures would restart it.
            httpGet:
              path: /healthz
              port: http
            periodSeconds: 5
            failureThreshold: 24
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              cpu: 2
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/quantos
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: models
              mountPath: /var/lib/quantos/models
      volumes:
        - name: config
          configMap:
            name: quantos-config
        # The distroless image has a read-only root filesystem; anything the
        # process writes needs an explicit volume.
        - name: tmp
          emptyDir: {}
        - name: models
          emptyDir:
            sizeLimit: 2Gi
