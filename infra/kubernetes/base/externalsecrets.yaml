# Secret material is referenced, never written.
#
# Every value below is a pointer into AWS Secrets Manager, resolved at runtime by
# the External Secrets operator using the IRSA role from
# infra/terraform/modules/iam. Nothing in this repository ever contains a
# credential, and `kubectl get secret -o yaml` is the only place a real value
# exists.
#
# If your cluster uses Sealed Secrets instead, the equivalent shape is at the
# bottom of this file, commented, with the same key names.
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: quantos-aws
  labels:
    app.kubernetes.io/part-of: quantos
spec:
  provider:
    aws:
      service: SecretsManager
      # Overlays patch the region. It is not templated here because a wrong
      # region fails loudly at sync, which is the behaviour we want.
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            # Annotated with quantos-external-secrets role ARN. That role reads
            # the four QuantOS secrets and nothing else in the account.
            name: quantos-external-secrets
---
# The store credentials every service needs: it builds the same App
# (internal/app.New) with store.driver=sql, and every binary serves the API
# surface, which validates tokens with the key named by auth.hmac_secret_env.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-store
  labels:
    app.kubernetes.io/part-of: quantos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: quantos-aws
    kind: SecretStore
  target:
    name: quantos-store
    creationPolicy: Owner
  data:
    # Key names match the QUANTOS_* variables in internal/config.applyEnv
    # exactly, so the Deployment's envFrom/secretKeyRef needs no translation.
    - secretKey: QUANTOS_POSTGRES_DSN
      remoteRef:
        key: quantos/postgres
        property: dsn
    - secretKey: QUANTOS_REDIS_ADDR
      remoteRef:
        key: quantos/redis
        property: addr
    - secretKey: QUANTOS_JWT_SECRET
      remoteRef:
        key: quantos/jwt-signing-key
        property: secret
---
# The bus endpoint. Not secret in the cryptographic sense — MSK authenticates
# with IAM, not with this string — but it is environment-specific and belongs
# with the other resolved values rather than in the ConfigMap.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-bus
  labels:
    app.kubernetes.io/part-of: quantos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: quantos-aws
    kind: SecretStore
  target:
    name: quantos-bus
    creationPolicy: Owner
  data:
    - secretKey: QUANTOS_KAFKA_BROKERS
      remoteRef:
        key: quantos/kafka
        property: bootstrap_brokers
---
# The LLM provider key, projected into a separate Secret so it can be mounted by
# exactly two Deployments. api-gateway is not one of them: it is the process
# that renders responses to a browser, and a provider key must not be one bug
# away from a response body.
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-llm
  labels:
    app.kubernetes.io/part-of: quantos
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: quantos-aws
    kind: SecretStore
  target:
    name: quantos-llm
    creationPolicy: Owner
  data:
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: quantos/llm-api-key
        property: api_key
# ---------------------------------------------------------------------------
# Sealed Secrets alternative.
#
# Same three Secret names, same keys. `encryptedData` values are ciphertext
# produced by kubeseal against the cluster's controller key and are safe to
# commit; they are omitted here rather than filled with a plausible-looking
# placeholder, because a placeholder that looks like a key is exactly what a
# secret scanner should flag.
#
#   kubectl create secret generic quantos-store --dry-run=client -o yaml \
#     --from-literal=QUANTOS_POSTGRES_DSN="$DSN" \
#     --from-literal=QUANTOS_REDIS_ADDR="$REDIS" \
#     --from-literal=QUANTOS_JWT_SECRET="$JWT" \
#   | kubeseal --format yaml > sealed-quantos-store.yaml
#
# apiVersion: bitnami.com/v1alpha1
# kind: SealedSecret
# metadata:
#   name: quantos-store
#   namespace: quantos
# spec:
#   encryptedData: {}   # kubeseal output goes here
