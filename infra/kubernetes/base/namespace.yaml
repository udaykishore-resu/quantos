apiVersion: v1
kind: Namespace
metadata:
  name: quantos
  labels:
    app.kubernetes.io/part-of: quantos
    # Baseline would permit hostPath and privileged escalation paths that no
    # QuantOS pod needs. The distroless image runs as uid 65532 with a
    # read-only root filesystem, so restricted costs nothing here.
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
