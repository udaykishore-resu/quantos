# The External Secrets operator runs in its own namespace but is listed here
# because its role is created alongside the service roles and its absence is the
# first thing to check when every pod is stuck on a missing Secret.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-external-secrets
  labels:
    app.kubernetes.io/part-of: quantos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/quantos-external-secrets
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
# The topic-provisioning Job. Separate from every service account because its
# role is the mirror image of theirs: it may create and configure topics and may
# not read or write a single event.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-topics
  labels:
    app.kubernetes.io/name: quantos-topics
    app.kubernetes.io/part-of: quantos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/quantos-topics
    eks.amazonaws.com/sts-regional-endpoints: "true"
