# One ServiceAccount per service, each annotated with the IRSA role that
# infra/terraform/modules/iam created for it.
#
# The role's trust policy pins system:serviceaccount:quantos:<this name>, so a
# pod that uses the wrong ServiceAccount gets an AssumeRoleWithWebIdentity
# failure rather than someone else's permissions.
#
# The account id below is a placeholder. Overlays patch the real ARNs from
# `terraform output -json service_role_arns`; 000000000000 is not a valid AWS
# account, so an unpatched overlay fails loudly instead of pointing at a
# stranger's role.
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: quantos
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::000000000000:role/quantos-api-gateway
    eks.amazonaws.com/sts-regional-endpoints: "true"
---
