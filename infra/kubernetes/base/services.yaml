# ClusterIP Services.
#
# Port numbers match deploy/docker-compose.yml and
# deploy/prometheus/prometheus.yml exactly: api-gateway on 8080 and the rest on
# 8081-8088 in the order they appear there. Keeping them identical across the
# three runtime modes means a port in a runbook is right whichever mode is
# running.
#
# /metrics is on the same port. internal/api.Mount registers it on the main
# router and telemetry.metrics_addr starts no second listener, so there is no
# separate metrics port to expose.
---
apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  labels:
    app.kubernetes.io/name: api-gateway
    app.kubernetes.io/part-of: quantos
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: api-gateway
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
---
