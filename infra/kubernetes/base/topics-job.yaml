# Kafka topic creation.
#
# The topic set is authoritative in internal/bus.TopicConfigs; `go run
# ./cmd/quantos topics` prints it and deploy/kafka/create-topics.sh creates the
# same set locally. This Job is the third rendering of that one specification,
# and the partition counts below are copied from its output verbatim.
#
# A topic created implicitly by the broker gets the broker default partition
# count. A market.quotes with one partition still works, still shows no error,
# and quietly destroys the per-symbol ordering guarantee that ADR-002 exists to
# provide - which is why auto-creation is disabled on the cluster and why this
# Job exists.
#
# Runs as a Helm/ArgoCD pre-sync hook: topics must exist before the first
# producer starts, or the first publish fails and the pod restarts into a
# CrashLoopBackOff that looks like a bug in the service.
apiVersion: batch/v1
kind: Job
metadata:
  name: quantos-topics
  labels:
    app.kubernetes.io/name: quantos-topics
    app.kubernetes.io/part-of: quantos
  annotations:
    argocd.argoproj.io/hook: PreSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 4
  # Cleaned up an hour after success. Long enough to read the log when a deploy
  # goes wrong, short enough not to accumulate.
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app.kubernetes.io/name: quantos-topics
        app.kubernetes.io/part-of: quantos
    spec:
      restartPolicy: OnFailure
      # Its own ServiceAccount and its own IRSA role. That role holds
      # CreateTopic and AlterTopicDynamicConfiguration - which no running
      # service should ever have, since changing a partition count silently
      # re-keys every symbol - and holds no ReadData or WriteData at all.
      serviceAccountName: quantos-topics
      nodeSelector:
        quantos.io/pool: platform
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: create-topics
          image: bitnami/kafka:3.7
          command: ["/bin/bash", "/scripts/create-topics.sh"]
          env:
            - name: KAFKA_BROKER
              valueFrom:
                secretKeyRef:
                  name: quantos-bus
                  key: QUANTOS_KAFKA_BROKERS
            - name: REPLICATION_FACTOR
              value: "3"
            - name: MIN_INSYNC_REPLICAS
              value: "2"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          volumeMounts:
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: scripts
          configMap:
            name: quantos-topics-script
            defaultMode: 0555
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: quantos-topics-script
  labels:
    app.kubernetes.io/part-of: quantos
data:
  # MSK IAM authentication. The client library reads the pod's IRSA credentials
  # from the projected token, so there is no password anywhere in this file.
  client.properties: |
    security.protocol=SASL_SSL
    sasl.mechanism=AWS_MSK_IAM
    sasl.jaas.config=software.amazon.msk.auth.iam.IAMLoginModule required;
    sasl.client.callback.handler.class=software.amazon.msk.auth.iam.IAMClientCallbackHandler

  create-topics.sh: |
    #!/usr/bin/env bash
    # Creates the QuantOS topic set on MSK.
    #
    # Partition counts and retention are from internal/bus.TopicConfigs, which
    # `quantos topics` prints. Replication factor and min.insync.replicas come
    # from the environment because they differ between the single-broker compose
    # stack and a three-broker MSK cluster; everything else is identical to
    # deploy/kafka/create-topics.sh on purpose.
    set -euo pipefail

    BROKER="${KAFKA_BROKER:?QUANTOS_KAFKA_BROKERS is not set}"
    RF="${REPLICATION_FACTOR:-3}"
    ISR="${MIN_INSYNC_REPLICAS:-2}"
    KT="kafka-topics.sh --bootstrap-server ${BROKER} --command-config /scripts/client.properties"

    echo "waiting for ${BROKER}..."
    for _ in $(seq 1 60); do
      if ${KT} --list >/dev/null 2>&1; then break; fi
      sleep 5
    done

    create() {
      local name="$1" partitions="$2" retention_ms="$3" cleanup="${4:-delete}"
      echo "topic ${name}: partitions=${partitions} retention=${retention_ms}ms policy=${cleanup} rf=${RF}"
      ${KT} --create --if-not-exists --topic "${name}" \
        --partitions "${partitions}" --replication-factor "${RF}" \
        --config "retention.ms=${retention_ms}" \
        --config "cleanup.policy=${cleanup}" \
        --config "min.insync.replicas=${ISR}"
      # Every topic gets a dead-letter partner: a poison message must have
      # somewhere to go that is not "retry forever".
      ${KT} --create --if-not-exists --topic "${name}.dlq" \
        --partitions 1 --replication-factor "${RF}" \
        --config "retention.ms=604800000" \
        --config "min.insync.replicas=${ISR}"
    }

    DAY=86400000
    create market.quotes            12 $((1 * DAY))
    create market.trades            12 $((1 * DAY))
    create market.bars              12 $((30 * DAY))
    create market.news               6 $((30 * DAY))
    create market.events             3 $((90 * DAY))
    create market.stale              3 $((7 * DAY))
    create market.rejected           3 $((7 * DAY))
    create features.updated         12 $((7 * DAY))
    create regime.updated            1 $((90 * DAY))
    create prediction.generated     12 $((30 * DAY))
    create signal.generated          6 $((365 * DAY)) compact
    create signal.invalidated        6 $((365 * DAY))
    create risk.updated              6 $((30 * DAY))
    create alert.generated           6 $((90 * DAY))
    create prediction.evaluated      6 $((365 * DAY))
    create model.drift.detected      1 $((365 * DAY))

    echo ""
    echo "topics present:"
    ${KT} --list | sort
