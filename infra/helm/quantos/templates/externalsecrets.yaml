{{/*
Secret material is referenced, never rendered.

`helm template` on this chart produces no credential of any kind: the values
below are pointers into AWS Secrets Manager, resolved at runtime by the External
Secrets operator. That property is worth more than the convenience of a
`--set postgresPassword=...` flag, so no such flag exists.
*/}}
{{- if and .Values.externalSecrets.enabled (ne .Values.mode "embedded") }}
apiVersion: external-secrets.io/v1beta1
kind: SecretStore
metadata:
  name: quantos-aws
  labels:
    {{- include "quantos.labels" . | nindent 4 }}
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.region }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.serviceAccount.name }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-store
  labels:
    {{- include "quantos.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {name: quantos-aws, kind: SecretStore}
  target: {name: quantos-store, creationPolicy: Owner}
  data:
    # Keys are the QUANTOS_* names internal/config.applyEnv reads, so the
    # Deployment's envFrom needs no translation.
    - secretKey: QUANTOS_POSTGRES_DSN
      remoteRef: {key: "{{ .Values.externalSecrets.secretPrefix }}/postgres", property: dsn}
    - secretKey: QUANTOS_REDIS_ADDR
      remoteRef: {key: "{{ .Values.externalSecrets.secretPrefix }}/redis", property: addr}
    - secretKey: QUANTOS_JWT_SECRET
      remoteRef: {key: "{{ .Values.externalSecrets.secretPrefix }}/jwt-signing-key", property: secret}
{{- if eq .Values.mode "cluster" }}
---
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-bus
  labels:
    {{- include "quantos.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {name: quantos-aws, kind: SecretStore}
  target: {name: quantos-bus, creationPolicy: Owner}
  data:
    - secretKey: QUANTOS_KAFKA_BROKERS
      remoteRef: {key: "{{ .Values.externalSecrets.secretPrefix }}/kafka", property: bootstrap_brokers}
{{- end }}
---
{{/*
The provider key, in its own Secret so it can be projected into exactly the
services that set llm: true. api-gateway is not one of them: it renders
responses to a browser, and a provider key must not be one bug away from a
response body.
*/}}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: quantos-llm
  labels:
    {{- include "quantos.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef: {name: quantos-aws, kind: SecretStore}
  target: {name: quantos-llm, creationPolicy: Owner}
  data:
    - secretKey: {{ .Values.config.llm.apiKeyEnv }}
      remoteRef: {key: "{{ .Values.externalSecrets.secretPrefix }}/llm-api-key", property: api_key}
{{- end }}
