{{/*
One ServiceAccount per service.

The IRSA annotation is only rendered when a role ARN is supplied. That is not
laziness: an empty annotation on EKS makes the pod fall back to the node role,
which holds the CNI and ECR permissions and nothing the application needs - so
the failure would be a confusing AccessDenied rather than an obvious "you forgot
the ARN". Omitting the annotation entirely produces the same failure with a
clearer cause, and NOTES.txt says so at install time.
*/}}
{{- if .Values.serviceAccounts.create }}
{{- if eq .Values.mode "embedded" }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-api-gateway
  labels:
    {{- include "quantos.labels" . | nindent 4 }}
{{- else }}
{{- range $name, $cfg := .Values.services }}
{{- if $cfg.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-{{ $name }}
  labels:
    {{- include "quantos.labels" $ | nindent 4 }}
    app.kubernetes.io/name: {{ $name }}
  {{- $arn := index $.Values.serviceAccounts.roleArns $name | default "" }}
  {{- if $arn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $arn | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
  {{- end }}
{{- end }}
{{- end }}
{{- if and (eq .Values.mode "cluster") .Values.topics.enabled }}
---
{{/*
The topic-provisioning Job gets its own account. Its role holds CreateTopic and
AlterTopicDynamicConfiguration - which no running service should ever have,
since changing a partition count silently re-keys every symbol - and holds no
ReadData or WriteData at all.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: quantos-topics
  labels:
    {{- include "quantos.labels" . | nindent 4 }}
    app.kubernetes.io/name: quantos-topics
  {{- $arn := index .Values.serviceAccounts.roleArns "topics" | default "" }}
  {{- if $arn }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $arn | quote }}
    eks.amazonaws.com/sts-regional-endpoints: "true"
  {{- end }}
{{- end }}
{{- end }}
{{- end }}
