  /api/v1/predictions:
    get:
      tags: [signals]
      operationId: listPredictions
      summary: Model predictions across horizons.
      description: |
        With `?ticker=` set and a live prediction held for that symbol, the
        answer is that single prediction from the read model. Otherwise the
        store is queried, and the read model is the last fallback.

        Read `confidence` and `uncertainty` together. `uncertainty` is Shannon
        entropy normalised to `[0,1]` over three classes. `confidence` is the
        normalised margin of the most likely outcome over the uniform
        distribution — it is deliberately **not** `1 - uncertainty`. Normalised
        entropy is a poor gate over three classes: the distribution
        `0.63 / 0.21 / 0.16` has an entropy ratio of 0.83, so `1 - uncertainty`
        would read as confidence 0.17 and fail every sensible threshold, while
        the max-probability margin gives it 0.45, a number an operator can
        reason about. Both fields are reported so neither has to be inferred.
      parameters:
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/TickerQuery"
        - $ref: "#/components/parameters/From"
      responses:
        "200":
          description: Predictions, newest first.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
