          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [paper]
      operationId: createOrder
      summary: Submit a simulated order.
      description: |
        Writes to the paper book only. No brokerage integration exists in this
        repository and this route cannot reach one.

        `idempotency_key` is **required**, not optional, because order
        submission must be safe to retry: a client that times out and resubmits
        must not double its position. The key is namespaced server-side as
        `api:<your key>` and stored on the order, so a replay of the same key
        returns the original order — the same `id`, the same `created_at`, and
        still `202` rather than a conflict. Choose a key that identifies the
        *intent*: a client-generated UUID per submission is right, the ticker
        is not.

        Unknown JSON fields are rejected with 400 rather than ignored, so a
        typo in a client request is an error rather than a silently dropped
        setting. `type` defaults to `MARKET`. `side` must be `BUY` or `SELL`
        and `quantity` must be positive.

        The response is `202 Accepted` with the order in `PENDING`: fills
        happen on the simulator's next mark, not inside the request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrderRequest" }
            example:
              idempotency_key: 4f6b0f1e-6d0c-4b27-8f1c-1c1c3a9f2d10
              ticker: AAPL
              side: BUY
              type: MARKET
              quantity: 10
      responses:
        "202":
          description: Accepted into the simulated book. Note this response carries no `meta`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/PaperOrder" }
              example:
                data:
                  id: 01a04662-ffec-7096-b900-bf533fe201c1
                  portfolio_id: paper-default
                  idempotency_key: "api:4f6b0f1e-6d0c-4b27-8f1c-1c1c3a9f2d10"
                  ticker: AAPL
                  side: BUY
                  type: MARKET
                  quantity: 10
                  time_in_force: DAY
                  status: PENDING
                  filled_qty: 0
                  avg_fill_price: 0
                  commission: 0
                  slippage_bps: 0
                  created_at: "2026-08-28T03:21:28.300329695Z"
                  updated_at: "2026-08-28T03:21:28.300329695Z"
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: e8734e6bc42f9d61
                served_at: "2026-08-28T03:21:28.300348506Z"
        "400":
          description: |
            Malformed body, unknown ticker, bad side, non-positive quantity, or
            a missing `idempotency_key`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              examples:
                missingIdempotencyKey:
                  value:
                    error:
                      code: bad_request
                      message: the request could not be understood
                      detail: "idempotency_key is required: order submission must be safe to retry"
                      request_id: c3f377608b4733b3
                    disclaimer: >-
                      QuantOS is an educational research and paper-trading
                      platform. Output is probabilistic, may be wrong, and is
                      not financial advice. No real-money orders are placed.
                unknownField:
                  value:
                    error:
                      code: bad_request
                      message: the request could not be understood
                      detail: 'json: unknown field "bogus"'
                      request_id: 62bda952042d1d7e
                    disclaimer: >-
                      QuantOS is an educational research and paper-trading
                      platform. Output is probabilistic, may be wrong, and is
                      not financial advice. No real-money orders are placed.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: |
            The principal lacks `paper:write`. Only the `operator` and `admin`
            roles hold it; `viewer` and `analyst` can read the book but not
            write to it.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                error:
                  code: forbidden
                  message: the principal lacks the required scope
                  detail: "required scope: paper:write"
                  request_id: f6d9145e15e16198
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          description: |
            The paper broker is not configured, or the rate limiter is
            unreachable. Writes fail closed when the limiter is down, so an
            outage cannot become an unmetered write channel.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                error:
                  code: unavailable
                  message: a required backing service is unavailable
                  detail: rate limiter unavailable; write rejected
                  request_id: 3c0e9a11bd7f4020
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
          headers:
            Retry-After:
              schema: { type: string }
              description: Always `5`.
