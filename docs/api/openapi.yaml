  /api/v1/risk/{ticker}:
    get:
      tags: [signals]
      operationId: getRisk
      summary: The latest risk assessment for one instrument.
      description: |
        Eleven named checks run on every assessment and all eleven are recorded
        with their numeric evidence, so a historical veto can be explained
        precisely rather than reconstructed. Resolution is most-severe-wins:
        there is no averaging, no weighting and no override, because averaging
        is exactly how a veto degrades into a suggestion.

        A check that could not be evaluated returns `SKIP`, and a skipped check
        carries decision `WATCH_ONLY`, never `ALLOW_PAPER_SIGNAL` — if a risk
        cannot be measured the platform does not get to assume it is absent.

        `score` and `level` are descriptive only. `decision` is what is
        enforced, and no consumer may derive a decision from the score.
      parameters:
        - $ref: "#/components/parameters/TickerPath"
      responses:
        "200":
          description: The assessment.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RiskAssessment" }
              example:
                data:
