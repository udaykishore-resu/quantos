  /api/v1/audit:
    get:
      tags: [audit]
      operationId: listAudit
      summary: The append-only record of state-changing requests.
      description: |
        Every non-`GET`, non-`HEAD`, non-`OPTIONS` request is recorded with the
        principal that made it, the outcome, the request id and the trace id.
        Reads are not audited: recording them would bury the writes that matter
        under a stream of dashboard polls.

        `outcome` is `success` below status 400 and `failure` at or above it, so
        a rejected write is in the log too — a security record that only holds
        the successes is not one.

        Requires the `audit:read` scope, which `viewer` and `analyst` do not
        hold.
      parameters:
        - name: limit
          in: query
          required: false
          description: Maximum records to return, newest first. Non-numeric or negative values fall back to the default; values above 5000 are clamped to 5000.
          schema: { type: integer, minimum: 0, maximum: 5000, default: 200 }
          example: 200
      responses:
        "200":
          description: Audit records.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/AuditEvent" }
              example:
                data:
                  - id: 01a04662-713a-754d-ae88-890d4caf7eb6
                    at: "2026-08-28T03:20:51.770249124Z"
                    principal: anonymous
                    action: POST /api/v1/auth/login
                    resource: /api/v1/auth/login
                    outcome: success
                    request_id: 933cf3d3507f6726
                    trace_id: 6b3affd5155c0d9df8176cea1ba7ae96
                    detail: { status: "200" }
                    remote_ip: 127.0.0.1:45978
                meta: { count: 2 }
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: 2f7c1a0b9e34d580
                served_at: "2026-08-28T03:21:33.145229321Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          description: The principal lacks `audit:read`.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                error:
                  code: forbidden
                  message: the principal lacks the required scope
                  detail: "required scope: audit:read"
                  request_id: d0297f3fb3cb19a3
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/stream:
    get:
      tags: [stream]
      operationId: stream
      summary: Server-Sent Events for dashboards.
      x-sse-payload-schema:
        $ref: "#/components/schemas/StreamPayload"
      description: |
        A long-lived `text/event-stream`. Server-to-client only, which is why
        SSE and not WebSocket: the browser reconnects automatically and
        `Last-Event-ID` resume comes for free.

        **Authentication.** `EventSource` cannot set headers, so this one route
        also accepts `?access_token=`. It is enabled per route rather than
        globally because a token in a URL ends up in access logs. Prefer the
        `Authorization` header wherever the client can set one.

        **Event names.** The `event:` field is the topic name: `quote`,
        `regime`, `signal`, `signal_invalidated`, `alert`, `prediction`,
        `portfolio`, `health`. `data:` is the payload alone — the numeric event
        id is in the SSE `id:` field, not inside the JSON. `quote` events are
        batched arrays, throttled to at most one frame every 500ms; the others
        are single objects.

        **Resume.** Reconnect with `Last-Event-ID` (or `?last_event_id=`, which
        is consulted only when the header is absent or zero) and the hub
        replays everything it still holds with a higher id. The buffer is a
        bounded ring of 1024 events by default. If your last id is older than
        everything the ring still holds, the hub first sends an unnumbered
        `resync` event and then replays what it has: **that is not a
        continuation, it is a gap notice.** On `resync`, discard local state
        and refetch over REST before applying anything that follows.

        **Overflow.** Each connection has a bounded queue (256 by default). A
        client that cannot keep up has its connection dropped with an
        `overflow` event rather than the server growing a buffer without bound.
        Reconnect and resume; if the ring has moved on you will get `resync`.

        **Caveat on `topics`.** The filter applies to *live* fan-out only. The
        replay that runs at connection time is not filtered, so a client that
        subscribes to `topics=regime` and resumes from an old id will receive
        buffered events of other topics before the live stream narrows. Filter
        on the `event:` name client-side rather than assuming the server did.

        The server also sends `retry: 3000` once after the replay, and a
        comment frame (`: heartbeat <unix>`) every 20 seconds. The heartbeat is
        what detects a dead peer; there is deliberately no write deadline on
        this route.
      security:
        - bearerAuth: []
        - streamToken: []
      parameters:
        - name: topics
          in: query
          required: false
          description: Comma-separated event names to receive on the live stream. Omit for all. Does not filter the replay.
          schema: { type: string }
          example: signal,alert,regime
        - name: last_event_id
          in: query
          required: false
          description: Resume point, consulted only when the `Last-Event-ID` header is absent or zero.
          schema: { type: integer, format: int64, minimum: 0 }
          example: 4193
        - name: access_token
          in: query
          required: false
          description: Bearer token for clients that cannot set headers. Prefer the `Authorization` header.
          schema: { type: string }
        - name: Last-Event-ID
          in: header
          required: false
          description: Standard SSE resume header, set automatically by `EventSource` on reconnect.
          schema: { type: integer, format: int64, minimum: 0 }
          example: 4193
      responses:
        "200":
          description: The event stream.
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-cache, no-transform`.
            X-Accel-Buffering:
              schema: { type: string }
              description: Always `no`. Without it nginx holds events until its buffer fills, which looks exactly like a broken stream.
          content:
            text/event-stream:
              schema:
                type: string
                description: |
                  Raw SSE framing. Each frame's `data:` is one payload, and the
                  `event:` name determines its schema — SSE has no place for a
                  discriminator inside the JSON, so the event name is the type
                  tag. The variants are enumerated by the payload schema
                  referenced from this operation's `x-sse-payload-schema`.
              examples:
                framing:
                  summary: Replay, retry hint, heartbeat and a live alert.
                  value: |
                    id: 1
                    event: quote
                    data: [{"ticker":"AAPL","bid":230.8123,"ask":230.8949,"last":230.8536,"ts":"2026-08-28T03:20:05Z","seq":1794231,"source":"sim"}]

                    retry: 3000

                    : heartbeat 1787887250

                    id: 4194
                    event: alert
                    data: {"id":"01a04662-92b4-7d6f-9d61-071b76b91325","dedup_key":"826e8eb6f3dcd3c858b4e7dcd1bb6365","type":"PROBABILITY_SHIFT","severity":"NOTICE","ticker":"WMT","title":"WMT 15m upside probability moved","status":"PAPER-TRADING WATCH"}
                gap:
                  summary: A reconnect that fell outside the replay window.
                  value: |
                    event: resync
                    data: {"reason":"the replay buffer no longer covers your last event id; refetch state over REST"}

                    id: 9412
                    event: regime
                    data: {"regime":"RANGE","confidence":0.75,"as_of":"2026-08-28T03:21:00Z"}
                overflow:
                  summary: A connection dropped for falling behind.
                  value: |
                    event: overflow
                    data: {"reason":"this connection could not keep up and was closed; reconnect to resume"}

        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A signed JWT in `Authorization: Bearer <token>`. Two signing schemes
        are accepted and nothing else — an unknown `alg` is rejected outright,
        which is what prevents the classic `alg: none` and algorithm-confusion
        attacks.

        `HS256` tokens are issued by QuantOS itself in embedded and compose
        mode via `POST /api/v1/auth/login`. `RS256` tokens come from a
        configured OIDC issuer and are validated against its JWKS, with the key
        set refetched when a key id is unknown or the cache has aged out. The
        issuer is always checked; the audience is checked when one is
        configured.

        Roles arrive in the `roles` claim, and the common OIDC shapes
        (`realm_access.roles`, `groups`) are read too, so a real issuer works
        without a custom mapper. A token with no recognisable roles is treated
        as `viewer`.
    cookieAuth:
      type: apiKey
      in: cookie
      name: quantos_token
      description: |
        The same token in a cookie, accepted as a fallback when no
        `Authorization` header is present. Convenient for a browser dashboard
        served from an allow-listed origin.
    streamToken:
      type: apiKey
      in: query
      name: access_token
      description: |
        Accepted by `GET /api/v1/stream` alone, because `EventSource` cannot
        set headers. It is enabled per route rather than globally: a token in a
        URL ends up in access logs, and that cost is only worth paying where
        there is no alternative.

  parameters:
    TickerPath:
      name: ticker
      in: path
      required: true
      description: |
        Instrument symbol. Normalised before lookup — upper-cased, trimmed, and
        `-` and `/` rewritten to `.` — so `brk-b`, `BRK/B` and `BRK.B` all
        resolve to the same instrument.
      schema: { $ref: "#/components/schemas/Ticker" }
      example: AAPL
    TickerQuery:
      name: ticker
      in: query
      required: false
      description: Filter to one instrument. Normalised the same way as the path parameter.
      schema: { $ref: "#/components/schemas/Ticker" }
      example: AAPL
    IdPath:
      name: id
      in: path
      required: true
      description: Resource identifier as returned by the corresponding list route.
      schema: { type: string }
    Limit50:
      name: limit
      in: query
      required: false
      description: Maximum items to return. Non-numeric or negative values fall back to the default; values above 5000 are clamped to 5000.
      schema: { type: integer, minimum: 0, maximum: 5000, default: 50 }
      example: 50
    Limit100:
      name: limit
      in: query
      required: false
      description: Maximum items to return. Non-numeric or negative values fall back to the default; values above 5000 are clamped to 5000.
      schema: { type: integer, minimum: 0, maximum: 5000, default: 100 }
      example: 100
    Limit500:
      name: limit
      in: query
      required: false
      description: Maximum items to return. Non-numeric or negative values fall back to the default; values above 5000 are clamped to 5000.
      schema: { type: integer, minimum: 0, maximum: 5000, default: 500 }
      example: 500
    Offset:
      name: offset
      in: query
      required: false
      description: How many items to skip before returning results. Echoed back in `meta.offset` only on the live-signal path.
      schema: { type: integer, minimum: 0, maximum: 5000, default: 0 }
      example: 0
    From:
      name: from
      in: query
      required: false
      description: Inclusive lower time bound, RFC3339. An unparseable value is ignored rather than rejected, so the filter is simply not applied.
      schema: { type: string, format: date-time }
      example: "2026-08-28T00:00:00Z"
    To:
      name: to
      in: query
      required: false
      description: Exclusive upper time bound, RFC3339. An unparseable value is ignored rather than rejected.
      schema: { type: string, format: date-time }
      example: "2026-08-28T06:00:00Z"

  responses:
    BadRequest:
      description: The request body could not be understood, or a field failed validation.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            error:
              code: bad_request
              message: the request could not be understood
              detail: request body must contain a single JSON object
              request_id: 62bda952042d1d7e
            disclaimer: >-
              QuantOS is an educational research and paper-trading platform.
              Output is probabilistic, may be wrong, and is not financial
              advice. No real-money orders are placed.
    Unauthorized:
      description: |
        No token, an expired token, or one that failed verification. Obtain a
        new token; retrying with the same one will not help.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            error:
              code: unauthorized
              message: authentication is required
              detail: "auth: no token supplied"
              request_id: 95c2bae4af72f7ef
            disclaimer: >-
              QuantOS is an educational research and paper-trading platform.
              Output is probabilistic, may be wrong, and is not financial
              advice. No real-money orders are placed.
    Forbidden:
      description: |
        The token verified but the principal's roles do not grant the scope the
        route requires. `detail` names the missing scope. This is a permanent
        answer for that principal; retrying is pointless.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            error:
              code: forbidden
              message: the principal lacks the required scope
              detail: "required scope: audit:read"
              request_id: d0297f3fb3cb19a3
            disclaimer: >-
              QuantOS is an educational research and paper-trading platform.
              Output is probabilistic, may be wrong, and is not financial
              advice. No real-money orders are placed.
    NotFound:
      description: No such resource. `detail` is present when the server can say something useful about what was looked up.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            error:
              code: not_found
              message: the resource does not exist
              request_id: 18ce5ea35be3fdc2
            disclaimer: >-
              QuantOS is an educational research and paper-trading platform.
              Output is probabilistic, may be wrong, and is not financial
              advice. No real-money orders are placed.
    RateLimited:
      description: |
        The caller's token bucket is empty. `Retry-After: 1` is set. Back off
        and retry; the bucket refills continuously rather than on a window
        boundary, so a short pause is enough.
      headers:
        Retry-After:
          schema: { type: string }
          description: Always `1`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            error:
              code: rate_limited
              message: too many requests
              request_id: bab66706dfbfec66
            disclaimer: >-
              QuantOS is an educational research and paper-trading platform.
              Output is probabilistic, may be wrong, and is not financial
              advice. No real-money orders are placed.
    Unavailable:
      description: |
        A backing service the route needs is not configured or not reachable.
        `Retry-After: 5` is set. This is the honest answer for a route that
        cannot be served from memory — it is returned instead of an empty list,
        because an empty list would be indistinguishable from "there is nothing
        to report".
      headers:
        Retry-After:
          schema: { type: string }
          description: Always `5`.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/ErrorBody" }
          example:
            error:
              code: unavailable
              message: a required backing service is unavailable
              request_id: 3c0e9a11bd7f4020
            disclaimer: >-
              QuantOS is an educational research and paper-trading platform.
              Output is probabilistic, may be wrong, and is not financial
              advice. No real-money orders are placed.

  schemas:
    Envelope:
      type: object
      description: |
        The wrapper around every successful response. `data` is the payload;
        the rest is context that a client should not have to ask for
        separately.
      required: [data, disclaimer, served_at]
      properties:
        data:
          description: The payload. Its shape is documented per route.
        meta:
          $ref: "#/components/schemas/Meta"
        degraded:
          type: array
          description: |
            Subsystems that were unavailable when this response was assembled,
            e.g. `["llm"]`. Present only when something was degraded. The
            answer is still served — it is visibly partial rather than quietly
            wrong.
          items: { type: string }
        disclaimer:
          type: string
          description: The research disclaimer, on every response without exception.
          const: >-
            QuantOS is an educational research and paper-trading platform.
            Output is probabilistic, may be wrong, and is not financial advice.
            No real-money orders are placed.
        request_id:
          type: string
          description: |
            Identifier for this request, also returned in the `X-Request-ID`
            header and written to the log line and audit record. Quote it when
            reporting a problem; it is how a support conversation finds the
            server side of the interaction.
        served_at:
          type: string
          format: date-time
          description: |
            When the response was written, in UTC. This is server wall-clock,
            not the age of the data — read `meta.as_of` for that.

    Meta:
      type: object
      description: |
        Pagination and freshness. Every field is omitted when it would be its
        zero value, so an absent `count` means zero and an absent `stale` means
        not stale.
      properties:
        count:
          type: integer
          description: How many items are in `data` for this response, not the total available.
        limit:
          type: integer
          description: The effective limit applied, after defaulting and clamping.
        offset:
          type: integer
          description: The offset applied. Echoed only on routes that support it.
        as_of:
          type: string
          format: date-time
          description: |
            The domain timestamp of the data, distinct from `served_at`. It is
            omitted rather than zero-valued when the server has no timestamp to
            report: a plain zero time would ship `0001-01-01T00:00:00Z` and a
            client that trusts it renders year one.
        stale:
          type: boolean
          description: |
            The underlying data has aged past the freshness gate. Stale data
            may be displayed but may never produce a new signal.
        stale_reason:
          type: string
          description: Why the freshness gate fired, e.g. how far past the threshold the last tick was.

    ErrorBody:
      type: object
      description: |
        The wrapper around every failure. `data` is never present alongside it.
        An unrecognised internal error is reported as `internal` without its
        text: the detail goes to the log with the request id attached, which is
        both a security and a support decision.
      required: [error, disclaimer]
      properties:
        error:
          type: object
          required: [code, message]
          properties:
            code:
              type: string
              description: Stable machine-readable code. Branch on this, never on `message`.
              enum: [bad_request, unauthorized, forbidden, not_found, rate_limited, unavailable, internal]
            message:
              type: string
              description: Fixed human-readable summary for the code. Identical for every occurrence of that code.
            detail:
              type: string
              description: What specifically went wrong on this request, when the server can say so without leaking internals.
            request_id:
              type: string
              description: Same identifier as `X-Request-ID`; quote it when reporting a problem.
        disclaimer:
          type: string
          description: The research disclaimer, carried on errors too.
          const: >-
            QuantOS is an educational research and paper-trading platform.
            Output is probabilistic, may be wrong, and is not financial advice.
            No real-money orders are placed.

    Ticker:
      type: string
      description: |
        Normalised instrument symbol — upper case, no spaces, dot-separated
        share classes. `__MACRO__` appears as the ticker on market-wide news.
      example: AAPL

    Side:
      type: string
      description: |
        Directional intent. Deliberately not called a recommendation: QuantOS
        emits research classifications, never advice.
      enum: [LONG, SHORT, FLAT]

    Regime:
      type: string
      description: |
        Observed market environment, not a forecast. It conditions which
        signals the platform considers meaningful. `UNDEFINED` is the
        unclassified state; the other nine are the enumeration used by
        evaluation partitioning and strategy validation.
      enum: [BULL_TREND, BEAR_TREND, RANGE, HIGH_VOLATILITY, LOW_VOLATILITY, BREAKOUT, REVERSAL, RISK_ON, RISK_OFF, UNDEFINED]

    Horizon:
      type: string
      description: Forecast horizon. The platform predicts on 15m, 60m and 1d by default.
      enum: ["15m", "60m", "1d", "5d"]

    Interval:
      type: string
      description: Bar duration.
      enum: ["1m", "5m", "15m", "1h", "1d"]

    Outcome:
      type: string
      description: |
        The discrete class a prediction distributes probability over. Three
        classes with an explicit FLAT band is deliberate: a two-class model
        forces a directional call on noise, and "no material move" is the most
        common short-horizon outcome.
      enum: [UP, FLAT, DOWN]

    Classification:
      type: string
      description: The research label attached to a scored instrument. Explicitly not advice.
      enum: [STRONG_WATCH, BULLISH_SETUP, NEUTRAL, HIGH_RISK, AVOID]

    RiskDecision:
      type: string
      description: |
        The risk engine's verdict, and the only field that is enforced.
        `ALLOW_PAPER_SIGNAL` is the sole value that permits a signal to be
        constructed at all.
      enum: [ALLOW_PAPER_SIGNAL, WATCH_ONLY, BLOCK]

    RiskLevel:
      type: string
      description: Coarse label for display. Descriptive only — no consumer may derive a decision from it.
      enum: [LOW, MEDIUM, HIGH, EXTREME]

    CheckStatus:
      type: string
      description: |
        One check's outcome. `SKIP` means the check could not be evaluated at
        all, which is different from passing and is treated as such: a skipped
        check carries decision `WATCH_ONLY`.
      enum: [PASS, WARN, FAIL, SKIP]

    SignalStatus:
      type: string
      description: Lifecycle state of a paper-trading signal.
      enum: [ACTIVE, INVALIDATED, EXPIRED, COMPLETED]

    InvalidationKind:
      type: string
      description: |
        A machine-checkable trigger that ends a signal. Every signal carries at
        least one; a signal cannot be constructed without one.
      enum: [PRICE_BELOW, PRICE_ABOVE, VWAP_CROSS, REGIME_CHANGE, VOLATILITY_ABOVE, CONFIDENCE_BELOW, RISK_VETO, TIME_EXPIRY, MATERIAL_NEWS]

    PredictionSource:
      type: string
      description: |
        Which layer produced the served distribution. `rules-fallback` means no
        model contributed; `blend` means a model and the deterministic rule
        prior were mixed at `blend_weight`.
      enum: [model, rules-fallback, blend]

    ModelStage:
      type: string
      description: |
        How a registered model participates in serving. `shadow` is scored and
        recorded but never served; `canary` serves a stable fraction of symbols.
      enum: [shadow, canary, active, retired]

    ModelFamily:
      type: string
      description: The inference implementation. Both are pure Go, which is what keeps serving free of a Python runtime.
      enum: [multinomial_logistic, gradient_boosted_stumps]

    DriftSeverity:
      type: string
      description: Grade of detected drift. Empty on a report computed before any samples existed.
      enum: ["", none, mild, moderate, severe]

    Comparator:
      type: string
      description: A rule condition operator. See `docs/strategy/authoring.md` for what each means and an example of each.
      enum: [gt, gte, lt, lte, between, outside, cross_up, cross_down, is_true, is_false]

    OrderSide:
      type: string
      enum: [BUY, SELL]

    OrderType:
      type: string
      enum: [MARKET, LIMIT, STOP]

    OrderStatus:
      type: string
      description: Lifecycle of a simulated order. An order is `PENDING` until the simulator's next mark.
      enum: [PENDING, FILLED, PARTIALLY_FILLED, CANCELLED, REJECTED]

    BacktestStatus:
      type: string
      enum: [QUEUED, RUNNING, COMPLETED, FAILED, ABORTED]

    AlertType:
      type: string
      description: What triggered the alert.
      enum: [VWAP_CROSS, VOLUME_ACCELERATION, BREAKOUT, MOMENTUM_SHIFT, REGIME_CHANGE, VOLATILITY_SPIKE, NEWS_EVENT, PROBABILITY_SHIFT, SIGNAL_GENERATED, SIGNAL_INVALIDATED, RISK_BLOCK, MODEL_DRIFT, DATA_STALE]

    AlertSeverity:
      type: string
      description: Ordering for display and routing.
      enum: [INFO, NOTICE, WARNING, CRITICAL]

    NewsCategory:
      type: string
      description: Assigned deterministically before any language model is involved.
      enum: [EARNINGS, GUIDANCE, M_AND_A, REGULATORY, LEGAL, PRODUCT, MANAGEMENT, ANALYST_ACTION, MACRO, GENERAL]

    Sentiment:
      type: string
      description: Coarse label. The numeric `sentiment_score` carries the detail.
      enum: [positive, neutral, negative]

    Materiality:
      type: string
      description: How much the event could plausibly move the instrument.
      enum: [high, medium, low]

    CorporateEventType:
      type: string
      enum: [EARNINGS, DIVIDEND, SPLIT, GUIDANCE, MERGER, OFFERING, INDEX_ADD, INDEX_DROP, MACRO]

    Exchange:
      type: string
      enum: [NYSE, NASDAQ, AMEX, ARCA, OTHER]

    AssetClass:
      type: string
      description: Separates equities from the ETFs, indices and macro references used as market context.
      enum: [EQUITY, ETF, INDEX, FUTURE, FX, RATE, COMMODITY]
    Distribution:
      type: object
      description: |
        A probability distribution over the three outcome classes. Always
        normalised — construction goes through a constructor that enforces it,
        and zero or invalid input yields the uniform distribution, which is the
        honest answer when the model has nothing to say.
      required: [up, flat, down]
      properties:
        up:
          type: number
          description: Probability the instrument closes the horizon above the FLAT band.
        flat:
          type: number
          description: Probability the move stays inside the FLAT band in both directions.
        down:
          type: number
          description: Probability the instrument closes the horizon below the FLAT band.

    ScenarioPrediction:
      type: object
      description: One horizon's distribution, with the thresholds that give its classes meaning.
      required: [horizon, distribution, flat_band_bps, expected_move_bps, confidence, uncertainty]
      properties:
        horizon: { $ref: "#/components/schemas/Horizon" }
        distribution: { $ref: "#/components/schemas/Distribution" }
        flat_band_bps:
          type: number
          description: |
            Half-width of the FLAT class in basis points. Without it, "UP:
            0.63" is meaningless — it does not say how far the instrument has
            to move to count as up.
        expected_move_bps:
          type: number
          description: Probability-weighted absolute move, derived from the distribution and the volatility estimate.
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: |
            The normalised margin of the most likely outcome over a uniform
            distribution: `(max_p - 1/3) / (1 - 1/3)`, clamped to `[0,1]`. It
            is 0 when the model has nothing to say and 1 for a point mass.

            It is deliberately **not** `1 - uncertainty`. Normalised entropy
            over three classes is a poor threshold: the distribution
            `0.63 / 0.21 / 0.16` has an entropy ratio of 0.83, so
            `1 - uncertainty` would call it confidence 0.17 and fail every
            sensible gate, while the max-probability margin gives 0.45 — a
            number an operator can reason about. Both are reported so neither
            has to be inferred from the other.
        uncertainty:
          type: number
          minimum: 0
          maximum: 1
          description: |
            Shannon entropy in nats divided by `ln(3)`. 0 is a point mass, 1
            means no information at all. Report it alongside `confidence`, not
            instead of it.

    FeatureContribution:
      type: object
      description: |
        Part of a prediction attributed to one feature. Computed from the model
        itself, not invented after the fact for presentation.
      required: [feature, value, weight, contribution]
      properties:
        feature:
          type: string
          description: Feature name, from the canonical set in `docs/strategy/authoring.md`.
        value:
          type: number
          description: The feature's value in the snapshot the model saw.
        weight:
          type: number
          description: The model's coefficient for this feature.
        contribution:
          type: number
          description: The feature's contribution to the model's log-odds — value times weight, in the model's units.

    Prediction:
      type: object
      description: |
        One model output for one instrument at one instant, across every
        horizon, carrying everything needed to reproduce it and later score it.
      required: [id, ticker, created_at, scenarios, model_id, model_version, source, feature_hash, feature_as_of, regime, regime_confidence, rule_prior, model_output, blend_weight, disclaimer]
      properties:
        id:
          type: string
          description: 'Time-ordered UUIDv7-shaped identifier; sortable by creation time.'
        ticker: { $ref: "#/components/schemas/Ticker" }
        created_at: { type: string, format: date-time }
        scenarios:
          type: array
          description: One entry per horizon. Read them together — a 15m and a 1d distribution can disagree, and that disagreement is information.
          items: { $ref: "#/components/schemas/ScenarioPrediction" }
        model_id:
          type: string
          description: 'Logical model name, stable across retrainings.'
        model_version:
          type: string
          description: 'The specific trained version that produced this. Stamped on signals and outcomes so performance is attributable.'
        artifact_sha:
          type: string
          description: 'SHA-256 of the artifact file. With the feature snapshot it is what makes this prediction recomputable.'
        source: { $ref: "#/components/schemas/PredictionSource" }
        feature_hash:
          type: string
          description: 'Content hash of the feature snapshot the model saw. Look it up to reproduce the inputs exactly.'
        feature_as_of:
          type: string
          format: date-time
          description: 'Domain timestamp of the newest input behind the features, which the leakage guard compares against the decision time.'
        regime: { $ref: "#/components/schemas/Regime" }
        regime_confidence:
          type: number
          description: 'How confident the regime classifier was, which conditions how much weight the regime-gated rules deserved.'
        rule_prior:
          allOf: [{ $ref: "#/components/schemas/Distribution" }]
          description: The deterministic rule engine's prior, before any model contributed.
        model_output:
          allOf: [{ $ref: "#/components/schemas/Distribution" }]
          description: The trained model's raw distribution, before blending.
        blend_weight:
          type: number
          description: |
            How much of the served distribution came from the model rather than
            the rule prior. It is scaled by the model's measured lift over its
            own base rate, so a model with no demonstrated skill contributes
            nothing rather than diluting the prior toward the middle.
        contributions:
          type: array
          items: { $ref: "#/components/schemas/FeatureContribution" }
        degraded:
          type: array
          description: Subsystems unavailable when this prediction was produced, recorded on the artifact rather than only at the edge.
          items: { type: string }
        disclaimer:
          type: string
          description: |
            The research disclaimer, carried on the record itself. A client
            that stores this object and redisplays it later would otherwise
            have stripped the caveat.

    PredictionOutcome:
      type: object
      description: The realised result of a prediction once its horizon has elapsed.
      required: [prediction_id, ticker, horizon, created_at, resolved_at, entry_price, exit_price, return_bps, predicted, actual, correct, distribution, brier_score, log_loss, regime, model_version, risk_decision]
      properties:
        prediction_id: { type: string }
        ticker: { $ref: "#/components/schemas/Ticker" }
        horizon: { $ref: "#/components/schemas/Horizon" }
        created_at: { type: string, format: date-time }
        resolved_at:
          type: string
          format: date-time
          description: 'When the horizon elapsed and a non-stale price was available to score against.'
        entry_price: { type: number }
        exit_price: { type: number }
        return_bps:
          type: number
          description: 'Realised move from entry to exit in basis points.'
        predicted: { $ref: "#/components/schemas/Outcome" }
        actual: { $ref: "#/components/schemas/Outcome" }
        correct:
          type: boolean
          description: 'Whether the argmax class matched. A coarse measure — the scores below say more.'
        distribution: { $ref: "#/components/schemas/Distribution" }
        brier_score:
          type: number
          description: 'Multiclass Brier score against the realised outcome. Lower is better; 0 is perfect and 2 is the worst possible.'
        log_loss:
          type: number
          description: 'Negative log likelihood of the realised outcome, clipped to avoid infinities.'
        regime: { $ref: "#/components/schemas/Regime" }
        model_version: { type: string }
        risk_decision:
          allOf: [{ $ref: "#/components/schemas/RiskDecision" }]
          description: |
            Whether this prediction was allowed to become a signal. Recorded
            precisely so the cost of the risk veto is measurable rather than
            assumed.

    MarketRegime:
      type: object
      description: |
        The market-wide state record. Every prediction, signal and evaluation
        stores the regime that was in force, which is what makes
        regime-partitioned performance analysis possible at all.
      required: [regime, confidence, volatility, breadth, momentum, risk_appetite, liquidity, inputs, scores, as_of, version, changed, stable_for]
      properties:
        regime: { $ref: "#/components/schemas/Regime" }
        confidence:
          type: number
          description: 'How strongly the winning classification beat the field.'
        secondary:
          allOf: [{ $ref: "#/components/schemas/Regime" }]
          description: The runner-up classification, so a dashboard can say "bull trend, but close to range" instead of implying certainty.
        secondary_score: { type: number }
        volatility:
          type: number
          description: 'Normalised to 0..1, where 1 is extreme.'
        breadth:
          type: number
          minimum: -1
          maximum: 1
          description: 'Advancers against decliners, -1..1.'
        momentum: { type: number, minimum: -1, maximum: 1 }
        risk_appetite:
          type: number
          minimum: -1
          maximum: 1
          description: '-1 is fully risk-off, +1 fully risk-on.'
        liquidity:
          type: number
          minimum: 0
          maximum: 1
          description: 'Market-wide volume normalised against its own recent history.'
        inputs:
          type: object
          description: The raw measurements the classifier consumed, retained so a past classification can be explained and re-derived.
          additionalProperties: { type: number }
        scores:
          type: object
          description: The score assigned to every candidate regime, not only the winner. The margin between the top two is what `secondary_score` summarises.
          additionalProperties: { type: number }
        evidence:
          type: array
          description: Human-readable statements the analyst may quote, each grounded in one of the inputs above.
          items: { type: string }
        as_of: { type: string, format: date-time }
        version:
          type: string
          description: 'Classifier version, so a regime series spanning a classifier change is interpretable.'
        changed:
          type: boolean
          description: 'Whether this classification replaced a different incumbent.'
        previous_regime: { $ref: "#/components/schemas/Regime" }
        stable_for:
          type: integer
          format: int64
          description: |
            How long the current regime has held, in nanoseconds. A regime must
            persist past the configured hysteresis before it replaces the
            incumbent: flapping regimes are worse than a slightly stale one,
            because every downstream threshold keys off the regime.

    SectorPerformance:
      type: object
      required: [sector, return_1d, return_5d, return_20d, rel_strength, breadth, rank]
      properties:
        sector: { type: string }
        etf: { $ref: "#/components/schemas/Ticker" }
        return_1d: { type: number }
        return_5d: { type: number }
        return_20d: { type: number }
        rel_strength:
          type: number
          description: 'Performance relative to the benchmark over the comparison window.'
        breadth:
          type: number
          description: 'Share of the sector''s constituents advancing.'
        rank:
          type: integer
          description: '1 is the strongest sector on relative strength.'

    Divergence:
      type: object
      description: Two series that normally move together and currently do not.
      required: [a, b, expected_correlation, observed_correlation, magnitude, note]
      properties:
        a: { type: string }
        b: { type: string }
        expected_correlation: { type: number }
        observed_correlation: { type: number }
        magnitude:
          type: number
          description: 'How far the observed correlation has moved from the expected one.'
        note: { type: string }

    RelationshipState:
      type: object
      required: [as_of, correlation, correlation_change, sectors, rotation, risk_on_score]
      properties:
        as_of: { type: string, format: date-time }
        correlation:
          type: [object, "null"]
          description: Pairwise correlation keyed by `"A|B"`, e.g. `"SPY|QQQ"`.
          additionalProperties: { type: number }
        correlation_change:
          type: [object, "null"]
          description: Change in each pair's correlation against its reference window. A large move here is often the signal, not the level.
          additionalProperties: { type: number }
        sectors:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/SectorPerformance" }
        rotation:
          type: string
          description: 'Coarse label for where money is moving, e.g. `CYCLICAL_TO_DEFENSIVE`.'
        risk_on_score: { type: number }
        divergences:
          type: array
          items: { $ref: "#/components/schemas/Divergence" }
        notes:
          type: array
          items: { type: string }

    RiskCheck:
      type: object
      description: |
        One named check with the numeric evidence behind it. Every check is
        persisted so a historical veto can be explained precisely rather than
        reconstructed.
      required: [name, status, decision, value, threshold, reason]
      properties:
        name:
          type: string
          description: The check's canonical name. Eleven are always present, in this order.
          enum: [data_freshness, liquidity, spread, volatility, event_proximity, model_confidence, model_health, market_regime, portfolio_concentration, correlation_exposure, portfolio_drawdown]
        status: { $ref: "#/components/schemas/CheckStatus" }
        decision:
          allOf: [{ $ref: "#/components/schemas/RiskDecision" }]
          description: |
            This check's own verdict. `PASS` maps to `ALLOW_PAPER_SIGNAL`,
            `WARN` and `SKIP` to `WATCH_ONLY`, `FAIL` to `BLOCK`.
        value:
          type: number
          description: 'What was measured, in the check''s own units.'
        threshold:
          type: number
          description: 'The limit it was measured against.'
        reason:
          type: string
          description: 'The measurement stated in words, with its units, for direct display.'
        skipped_reason:
          type: string
          description: Present only on `SKIP` — why the check could not run, e.g. that realised volatility is not yet warm.

    RiskAssessment:
      type: object
      description: |
        The complete risk verdict for one instrument at one instant. The engine
        holds unconditional veto authority: resolution across checks is
        most-severe-wins, with no averaging, weighting or override, because
        averaging is exactly how a veto degrades into a suggestion.
      required: [id, ticker, created_at, decision, level, score, checks, config_hash, regime, evaluated_at]
      properties:
        id: { type: string }
        ticker: { $ref: "#/components/schemas/Ticker" }
        created_at: { type: string, format: date-time }
        decision:
          allOf: [{ $ref: "#/components/schemas/RiskDecision" }]
          description: The enforced verdict. Only `ALLOW_PAPER_SIGNAL` permits a signal to be constructed.
        level: { $ref: "#/components/schemas/RiskLevel" }
        score:
          type: number
          minimum: 0
          maximum: 100
          description: |
            0..100, higher is riskier. Descriptive only and derived from the
            spread of check statuses; the `decision` is what is enforced and no
            consumer may derive a decision from this number.
        checks:
          type: array
          description: All eleven checks with their evidence, including the ones that passed and the ones that could not run.
          items: { $ref: "#/components/schemas/RiskCheck" }
        blockers:
          type: array
          description: Reasons from checks that returned `FAIL`. Non-empty means the decision is `BLOCK`.
          items: { type: string }
        warnings:
          type: array
          description: Reasons from checks that returned `WARN`.
          items: { type: string }
        config_hash:
          type: string
          description: 'Hash of the thresholds in force, so a past veto can be re-derived after they change.'
        regime: { $ref: "#/components/schemas/Regime" }
        feature_hash: { type: string }
        prediction_id: { type: string }
        evaluated_at: { type: string, format: date-time }

    InvalidationCondition:
      type: object
      description: |
        One machine-evaluable condition that ends a signal. A signal is not
        allowed to exist without at least one, which is enforced at
        construction rather than left to callers.
      required: [kind, description]
      properties:
        kind: { $ref: "#/components/schemas/InvalidationKind" }
        threshold:
          type: number
          description: 'The resolved absolute level, in the units of whatever the kind measures.'
        regime_from: { $ref: "#/components/schemas/Regime" }
        deadline:
          type: string
          format: date-time
          description: 'Present on `TIME_EXPIRY`.'
        description:
          type: string
          description: 'What would have to happen for the thesis to be wrong, in words, for display.'

    Signal:
      type: object
      description: |
        A paper-trading signal. It can only be constructed through a path that
        requires an allowing risk assessment and at least one invalidation
        condition, so those two guarantees are structural rather than a matter
        of every caller remembering to check.

        `entry_reference`, `stop_reference` and `target_reference` are named
        *references* rather than prices to act on. They are the levels the
        thesis was framed against.
      required: [id, ticker, created_at, expires_at, side, status, strength, confidence, horizon, entry_reference, stop_reference, target_reference, suggested_weight, invalidations, strategy_id, rules_fired, evidence, prediction_id, risk_assessment_id, feature_hash, regime, model_version, config_hash, correlation_id, disclaimer]
      properties:
        id: { type: string }
        ticker: { $ref: "#/components/schemas/Ticker" }
        created_at: { type: string, format: date-time }
        expires_at:
          type: string
          format: date-time
          description: 'Defaults to creation plus the horizon''s duration when the strategy does not set one explicitly.'
        side: { $ref: "#/components/schemas/Side" }
        status: { $ref: "#/components/schemas/SignalStatus" }
        strength:
          type: number
          minimum: 0
          maximum: 100
          description: 'How much of the strategy''s directional weight fired, scaled to 0..100. Not a probability.'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 'The prediction''s confidence at the moment the signal was created — the max-probability margin, not `1 - uncertainty`.'
        horizon: { $ref: "#/components/schemas/Horizon" }
        entry_reference:
          type: number
          description: 'The price level the thesis was framed against.'
        stop_reference:
          type: number
          description: 'The level below which the thesis is wrong, derived from ATR by the strategy''s stop multiple.'
        target_reference:
          type: number
          description: 'The level at which the thesis has played out, derived from ATR by the strategy''s target multiple.'
        suggested_weight:
          type: number
          minimum: 0
          maximum: 1
          description: 'Fraction of simulated equity, bounded by the strategy''s `max_weight`. A sizing suggestion for the paper book, not an instruction.'
        invalidations:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InvalidationCondition" }
        strategy_id: { type: string }
        rules_fired:
          type: array
          description: Ids of the rules that fired, in weight order.
          items: { type: string }
        evidence:
          type: array
          description: Each firing rule's description with the values that satisfied it, so the reasoning can be checked against the numbers.
          items: { type: string }
        counter_evidence:
          type: array
          description: |
            Rules that fired *against* the thesis. They are surfaced rather than
            suppressed: a signal that only ever shows what agrees with it is a
            signal nobody can evaluate.
          items: { type: string }
        prediction_id: { type: string }
        risk_assessment_id:
          type: string
          description: 'Always resolves — the assessment is what permitted this signal to exist.'
        score_ref: { type: string }
        feature_hash:
          type: string
          description: 'The snapshot hash. Combined with `model_version`, it is what makes the decision reproducible.'
        regime: { $ref: "#/components/schemas/Regime" }
        model_version: { type: string }
        config_hash: { type: string }
        correlation_id:
          type: string
          description: 'Ties this signal to every event on the same causal chain, back to the bar that started it.'
        invalidated_at: { type: string, format: date-time }
        invalidation_kind: { $ref: "#/components/schemas/InvalidationKind" }
        invalidation_note:
          type: string
          description: 'The measurement that triggered invalidation, in words.'
        explanation:
          type: string
          description: |
            The analyst's narrative, filled in asynchronously and never
            required for the signal to be valid. It is produced strictly after
            the decision is final and cannot influence any number in this
            object.
        explanation_source:
          type: string
          description: 'Which layer wrote the narrative — a deterministic template or a named language model.'
        disclaimer:
          type: string
          description: The research disclaimer, carried on the signal itself so it survives being stored and redisplayed.
    StockScore:
      type: object
      description: |
        The composite research score for one instrument. Every sub-score is
        0..100 and every one is independently explainable, which is the point:
        a single number nobody can decompose is a number nobody can argue with.
      required: [ticker, created_at, fundamental_score, growth_score, quality_score, valuation_score, technical_score, momentum_score, sector_score, market_regime_score, risk_score, event_risk_score, final_score, classification, weights, strategy_id, config_hash, disclaimer]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        created_at: { type: string, format: date-time }
        fundamental_score:
          type: number
          description: 'Balance-sheet and income-statement health against the strategy''s own thresholds.'
        growth_score:
          type: number
          description: 'Revenue and earnings expansion.'
        quality_score:
          type: number
          description: 'Margin durability, returns on capital and earnings consistency.'
        valuation_score:
          type: number
          description: 'Cheapness against the instrument''s own history and its sector, not against an absolute multiple.'
        technical_score:
          type: number
          description: 'Price structure — trend, position against moving averages and bands.'
        momentum_score:
          type: number
          description: 'Persistence of direction across the momentum and relative-strength features.'
        sector_score:
          type: number
          description: 'The instrument''s sector''s standing in the current rotation.'
        market_regime_score:
          type: number
          description: 'How well the setup fits the regime in force.'
        risk_score:
          type: number
          description: 'Higher is *safer* — it is the inverse of the risk engine''s severity, so all ten sub-scores point the same way.'
        event_risk_score:
          type: number
          description: 'Higher is safer. Falls as a material scheduled event approaches.'
        final_score:
          type: number
          minimum: 0
          maximum: 100
          description: 'The weighted composite.'
        classification: { $ref: "#/components/schemas/Classification" }
        weights:
          type: object
          description: The strategy weights in force when this was computed, recorded so a historical score can be recomputed after the configuration changes.
          additionalProperties: { type: number }
        strategy_id: { type: string }
        config_hash: { type: string }
        missing:
          type: array
          description: |
            Sub-scores that could not be computed, e.g. fundamentals for an
            ETF. Missing components are excluded and the remaining weights
            renormalised — never silently treated as zero, which would drag the
            composite down for a reason that does not exist.
          items: { type: string }
        evidence:
          type: array
          description: The measurements behind each sub-score, in words with their values.
          items: { type: string }
        disclaimer:
          type: string
          description: 'The research disclaimer, carried on the score record itself.'

    OpportunityScore:
      type: object
      description: Fuses the composite score, the prediction and the current environment into one ranked number.
      required: [ticker, created_at, score, bias, confidence, risk, components, risk_reward, expected_move_bps, stop_distance_bps, target_distance_bps, regime, disclaimer]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        created_at: { type: string, format: date-time }
        score: { type: number, minimum: 0, maximum: 100 }
        bias: { $ref: "#/components/schemas/Side" }
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 'The prediction''s max-probability margin, carried through unchanged.'
        risk: { $ref: "#/components/schemas/RiskLevel" }
        components:
          type: object
          description: |
            The additive decomposition of `score` — the contributions sum to
            it. Exposed so the number is never a black box: a rank a user
            cannot take apart is a rank they cannot disagree with.
          additionalProperties: { type: number }
        risk_reward:
          type: number
          description: 'Target distance divided by stop distance.'
        expected_move_bps:
          type: number
          description: 'Probability-weighted absolute move at the strategy''s horizon.'
        stop_distance_bps:
          type: number
          description: 'Distance from the entry reference to the stop reference.'
        target_distance_bps:
          type: number
          description: 'Distance from the entry reference to the target reference.'
        prediction_id: { type: string }
        score_ref: { type: string }
        regime: { $ref: "#/components/schemas/Regime" }
        disclaimer:
          type: string
          description: 'The research disclaimer, carried on the record itself.'

    FeatureSnapshot:
      type: object
      description: |
        The complete, immutable record of everything a downstream model saw for
        one instrument at one instant. It is the unit of reproducibility: this
        snapshot plus a model artifact digest is sufficient to recompute the
        prediction exactly.
      required: [ticker, as_of, interval, values, warm, last, bid, ask, volume, spread_bps, stale, last_tick_at, schema_version, hash]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        as_of:
          type: string
          format: date-time
          description: 'Domain timestamp of the newest input that produced these values.'
        interval: { $ref: "#/components/schemas/Interval" }
        values:
          type: object
          description: Every computed feature by canonical name. See `docs/strategy/authoring.md` for what each measures.
          additionalProperties: { type: number }
        warm:
          type: object
          description: |
            Per-feature warm-up state. A cold feature has seen too little
            history for its value to mean anything, and is never fed to a
            model. Read this before reading `values` — a cold value is present
            but not usable, and treating it as a number is how a rule fires on
            an indicator that has not converged.
          additionalProperties: { type: boolean }
        last:
          type: number
          description: 'Last traded price, carried alongside so consumers never need a second lookup.'
        bid: { type: number }
        ask: { type: number }
        volume: { type: number }
        spread_bps:
          type: number
          description: 'Quoted spread in basis points of the mid. The risk engine''s spread check reads this.'
        stale:
          type: boolean
          description: |
            Set by the freshness gate. A stale snapshot may be displayed but
            may never produce a new signal, and a stale price is never used to
            resolve a prediction — scoring against one would manufacture
            outcomes out of missing data.
        stale_reason: { type: string }
        last_tick_at:
          type: string
          format: date-time
          description: 'When market data for this instrument last arrived. The freshness check measures age from here.'
        schema_version:
          type: integer
          description: 'Bumped only when the meaning of an existing feature name changes; adding a feature does not require a bump.'
        hash:
          type: string
          description: |
            Stable content hash over the decision-relevant contents, with float
            formatting fixed so it is reproducible across platforms while
            staying sensitive to real changes. Cold features are hashed
            distinctly from warm ones.

    Alert:
      type: object
      required: [id, dedup_key, type, severity, created_at, title, message, disclaimer]
      properties:
        id: { type: string }
        dedup_key:
          type: string
          description: |
            What makes alerting idempotent across redelivery and replay. The
            same condition in the same time bucket collapses to one alert, and
            the durable store carries a unique index on this, so an in-memory
            dedup cache being wiped cannot cause a duplicate page.
        type: { $ref: "#/components/schemas/AlertType" }
        severity: { $ref: "#/components/schemas/AlertSeverity" }
        ticker: { $ref: "#/components/schemas/Ticker" }
        created_at: { type: string, format: date-time }
        title: { type: string }
        message:
          type: string
          description: 'Prose for a human. Do not parse it — the numbers are in `before` and `after`.'
        before:
          type: object
          description: The measured state before the transition, so a client renders authoritative numbers rather than scraping `message`.
          additionalProperties: { type: number }
        after:
          type: object
          description: The measured state after the transition.
          additionalProperties: { type: number }
        regime: { $ref: "#/components/schemas/Regime" }
        risk_level: { $ref: "#/components/schemas/RiskLevel" }
        status:
          type: string
          description: 'Display banner, e.g. `PAPER-TRADING WATCH`. Present so no alert can be read as an instruction.'
        signal_id: { type: string }
        prediction_id: { type: string }
        correlation_id:
          type: string
          description: 'Ties this alert to the causal chain that produced it.'
        disclaimer:
          type: string
          description: 'The research disclaimer, carried on the alert itself.'

    NewsEvent:
      type: object
      description: |
        A processed news item. Only the typed fields below cross into the
        decision path; the raw article text never does.
      required: [id, ticker, timestamp, ingested_at, source, headline, category, sentiment, sentiment_score, materiality, materiality_score, confidence, expected_horizon, stage]
      properties:
        id: { type: string }
        ticker:
          allOf: [{ $ref: "#/components/schemas/Ticker" }]
          description: The affected instrument, or `__MACRO__` for market-wide items.
        timestamp:
          type: string
          format: date-time
          description: 'When the event happened, per the source.'
        ingested_at:
          type: string
          format: date-time
          description: 'When QuantOS saw it. The gap between the two is the platform''s news latency.'
        source: { type: string }
        headline: { type: string }
        url: { type: string, format: uri }
        category: { $ref: "#/components/schemas/NewsCategory" }
        sentiment: { $ref: "#/components/schemas/Sentiment" }
        sentiment_score:
          type: number
          minimum: -1
          maximum: 1
          description: 'Signed direction of the news for this instrument.'
        materiality: { $ref: "#/components/schemas/Materiality" }
        materiality_score:
          type: number
          minimum: 0
          maximum: 1
          description: 'How much the event could plausibly move the instrument, independent of direction.'
        confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 'How sure the classifier is of its own labels.'
        affected_sector: { type: string }
        expected_horizon:
          allOf: [{ $ref: "#/components/schemas/Horizon" }]
          description: Over what period the effect, if any, would be expected to appear.
        stage:
          type: string
          description: |
            `deterministic` or `llm-enriched`. Deterministic classification
            always runs first; a language model may only agree or add detail,
            never overturn it.
        matched_terms:
          type: array
          description: The terms that drove the deterministic classification, so the label can be checked.
          items: { type: string }
        llm_model: { type: string }
        llm_agreed:
          type: boolean
          description: 'Whether the language model''s reading matched the deterministic one. A disagreement is recorded, not resolved silently.'
        deduplicated: { type: boolean }
        cluster_id:
          type: string
          description: 'Groups retellings of the same story so one event is not counted many times.'

    CorporateEvent:
      type: object
      required: [id, ticker, type, scheduled_at, confirmed, source]
      properties:
        id: { type: string }
        ticker: { $ref: "#/components/schemas/Ticker" }
        type: { $ref: "#/components/schemas/CorporateEventType" }
        scheduled_at: { type: string, format: date-time }
        confirmed:
          type: boolean
          description: |
            An exchange-confirmed date rather than an estimate. It matters to
            the risk engine's event-proximity check, which blocks around
            material events: the model's training distribution does not contain
            the discontinuity an earnings release introduces.
        detail: { type: string }
        source: { type: string }

    Stock:
      type: object
      description: A point-in-time description of an instrument in the universe.
      required: [ticker, company, sector, industry, exchange, asset_class, currency, market_cap, shares_outstanding, avg_volume_30d, avg_notional_30d, beta, listed_at]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        company: { type: string }
        sector: { type: string }
        industry: { type: string }
        exchange: { $ref: "#/components/schemas/Exchange" }
        asset_class: { $ref: "#/components/schemas/AssetClass" }
        currency: { type: string }
        market_cap: { type: number }
        shares_outstanding: { type: number }
        avg_volume_30d: { type: number }
        reference_price:
          type: number
          description: |
            A nominal level used only by the simulator to start an instrument
            at a recognisable value. It is fixture data and is never presented
            as a quote.
        avg_notional_30d:
          type: number
          description: 'Average daily traded value. The risk engine''s liquidity check reads this.'
        beta: { type: number }
        listed_at:
          type: string
          format: date-time
          description: |
            With `delisted_at`, this is what makes historical universes
            point-in-time so backtests do not suffer survivorship bias.
        delisted_at: { type: string, format: date-time }
        tags:
          type: array
          items: { type: string }

    Candle:
      type: object
      required: [ticker, interval, open, high, low, close, volume, vwap, trades, start, end, adjusted, source, partial, seq]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        interval: { $ref: "#/components/schemas/Interval" }
        open: { type: number }
        high: { type: number }
        low: { type: number }
        close: { type: number }
        volume: { type: number }
        vwap: { type: number }
        trades:
          type: integer
          format: int64
          description: 'Number of prints in the bar.'
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        adjusted:
          type: boolean
          description: |
            Prices are split and dividend adjusted. Mixing adjusted and
            unadjusted series is refused upstream, so every bar in one response
            agrees.
        source: { type: string }
        partial:
          type: boolean
          description: 'The bar''s interval has not closed yet.'
        seq:
          type: integer
          format: int64
          description: 'Monotonic sequence from the provider, used to detect gaps.'

    Quote:
      type: object
      required: [ticker, bid, ask, bid_size, ask_size, last, last_size, volume, ts, seq, source]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        bid: { type: number }
        ask: { type: number }
        bid_size:
          type: number
          description: |
            A two-sided book with no size on a side is rejected at validation:
            it is not a market you could trade against, and the spread it
            implies is fiction that the risk engine's spread check would read
            as real.
        ask_size: { type: number }
        last: { type: number }
        last_size: { type: number }
        volume: { type: number }
        ts: { type: string, format: date-time }
        seq: { type: integer, format: int64 }
        source: { type: string }
    ModelInfo:
      type: object
      description: A loaded inference artifact as the API reports it.
      required: [id, version, family, horizon, features, artifact_sha]
      properties:
        id:
          type: string
          description: 'Logical model name.'
        version: { type: string }
        family: { $ref: "#/components/schemas/ModelFamily" }
        horizon: { $ref: "#/components/schemas/Horizon" }
        features:
          type: array
          description: The declared feature list in the exact order inference consumes it. The loader refuses an artifact whose list does not match, so ordering cannot silently drift.
          items: { type: string }
        artifact_sha:
          type: string
          description: 'SHA-256 of the artifact file on disk.'

    ConfusionMatrix:
      type: object
      description: Predicted-against-actual counts across the three outcome classes, keyed `counts[predicted][actual]`.
      required: [counts, total]
      properties:
        counts:
          type: object
          additionalProperties:
            type: object
            additionalProperties: { type: integer }
        total: { type: integer }

    CalibrationBin:
      type: object
      description: |
        One bucket of a reliability diagram. A well-calibrated model has
        `mean_predicted` close to `observed_frequency` in every populated
        bucket; `deviation` is the gap.
      required: [lower, upper, count, mean_predicted, observed_frequency, deviation]
      properties:
        lower: { type: number }
        upper: { type: number }
        count:
          type: integer
          description: 'Samples in this bucket. A large deviation on a count of three says nothing.'
        mean_predicted: { type: number }
        observed_frequency: { type: number }
        deviation: { type: number }

    ModelEvaluation:
      type: object
      description: Measured performance over a window.
      required: [model_version, window, start, end, horizon, samples, accuracy, base_rate, lift, brier_score, brier_skill_score, log_loss, precision_up, recall_up, precision_down, recall_down, macro_f1, confusion, max_calibration_deviation, expected_calibration_error, computed_at]
      properties:
        model_version: { type: string }
        window:
          type: string
          description: 'Which window this covers, e.g. `rolling`.'
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        horizon: { $ref: "#/components/schemas/Horizon" }
        regime:
          allOf: [{ $ref: "#/components/schemas/Regime" }]
          description: Set only on per-regime breakdowns.
        samples: { type: integer }
        accuracy: { type: number }
        base_rate:
          type: number
          description: 'The accuracy of always predicting the majority class. Accuracy without it is not interpretable.'
        lift:
          type: number
          description: 'Accuracy minus base rate — the amount of skill actually demonstrated.'
        brier_score:
          type: number
          description: 'Mean multiclass Brier score. Lower is better.'
        brier_skill_score:
          type: number
          description: 'Brier score relative to the base-rate forecast. Positive means better than always guessing the majority class.'
        log_loss: { type: number }
        precision_up: { type: number }
        recall_up: { type: number }
        precision_down: { type: number }
        recall_down: { type: number }
        macro_f1: { type: number }
        confusion: { $ref: "#/components/schemas/ConfusionMatrix" }
        calibration:
          type: array
          items: { $ref: "#/components/schemas/CalibrationBin" }
        max_calibration_deviation:
          type: number
          description: 'The largest gap in any populated reliability bucket. This is the promotion gate in the governance charter.'
        expected_calibration_error:
          type: number
          description: 'Count-weighted mean deviation across buckets.'
        computed_at: { type: string, format: date-time }

    DriftReport:
      type: object
      required: [model_version, computed_at, severity, feature_drift, max_feature_psi, prediction_drift, reference_accuracy, recent_accuracy, accuracy_delta, reference_brier, recent_brier, samples, recommendation]
      properties:
        model_version: { type: string }
        computed_at: { type: string, format: date-time }
        severity: { $ref: "#/components/schemas/DriftSeverity" }
        feature_drift:
          type: [object, "null"]
          description: Population stability index per feature. Above 0.25 is the conventional "significant shift" threshold.
          additionalProperties: { type: number }
        max_feature_psi: { type: number }
        drifted_features:
          type: array
          items: { type: string }
        prediction_drift:
          type: number
          description: 'KL divergence of the recent prediction distribution from the reference window — the model''s output moving even where its inputs have not.'
        reference_accuracy: { type: number }
        recent_accuracy: { type: number }
        accuracy_delta: { type: number }
        reference_brier: { type: number }
        recent_brier: { type: number }
        regime_degradation:
          type: object
          description: |
            Regimes where performance has fallen below the base rate. This is
            the practically important failure: a model that is fine on average
            and useless in high volatility is useless when it matters.
          additionalProperties: { type: number }
        samples: { type: integer }
        recommendation: { type: string }
        reasons:
          type: array
          items: { type: string }

    ModelHealth:
      type: object
      description: The dashboard-facing summary of the serving model's measured state.
      required: [model_id, model_version, stage, as_of, accuracy, calibration, brier_score, drift, high_volatility_accuracy, trending_accuracy, range_accuracy, samples, healthy, last_evaluated_at]
      properties:
        model_id: { type: string }
        model_version: { type: string }
        stage: { $ref: "#/components/schemas/ModelStage" }
        as_of: { type: string, format: date-time }
        accuracy: { type: number }
        calibration:
          type: number
          description: '`1 - ECE`, so higher is better — the opposite direction to `brier_score`.'
        brier_score:
          type: number
          description: 'Lower is better.'
        drift: { $ref: "#/components/schemas/DriftSeverity" }
        high_volatility_accuracy:
          type: number
          description: 'Accuracy restricted to high-volatility regimes, where a model is most likely to fail and most consequential when it does.'
        trending_accuracy: { type: number }
        range_accuracy: { type: number }
        samples: { type: integer }
        healthy: { type: boolean }
        issues:
          type: array
          items: { type: string }
        last_evaluated_at: { type: string, format: date-time }
        provisional:
          type: boolean
          description: |
            The record is derived from the model's own offline test split
            rather than from live resolved predictions. It exists to resolve a
            bootstrap problem: a newly promoted model has no live outcomes yet,
            and refusing to serve until it does means it never gets any. The
            measurement is real — made on data the model never saw — but under
            a different distribution, so it says so, and is replaced by live
            evidence as soon as enough predictions resolve.

    VetoCost:
      type: object
      description: |
        What the risk engine's blocks cost. Comparing the realised accuracy and
        mean return of blocked predictions against allowed ones is the only way
        to distinguish a veto that protects the book from one that merely
        suppresses good calls.
      required: [blocked, watch_only, allowed, blocked_accuracy, allowed_accuracy, blocked_mean_return_bps, allowed_mean_return_bps, interpretation]
      properties:
        blocked: { type: integer }
        watch_only: { type: integer }
        allowed: { type: integer }
        blocked_accuracy: { type: number }
        allowed_accuracy: { type: number }
        blocked_mean_return_bps: { type: number }
        allowed_mean_return_bps: { type: number }
        interpretation:
          type: string
          description: 'The comparison stated in words, including when there is not yet enough evidence to state one.'

    ModelHealthResponse:
      type: object
      required: [health, drift]
      properties:
        health: { $ref: "#/components/schemas/ModelHealth" }
        drift: { $ref: "#/components/schemas/DriftReport" }
        overall: { $ref: "#/components/schemas/ModelEvaluation" }
        by_regime:
          type: object
          description: Rolling evaluation partitioned by the regime in force when each prediction was made.
          additionalProperties: { $ref: "#/components/schemas/ModelEvaluation" }
        veto_cost: { $ref: "#/components/schemas/VetoCost" }
        pending:
          type: integer
          description: 'Predictions tracked but not yet resolved, because their horizon has not elapsed.'

    EvaluationsResponse:
      type: object
      required: [outcomes, evaluation, calibration]
      properties:
        outcomes:
          type: [array, "null"]
          description: The individual resolved predictions, trimmed to the most recent `limit`.
          items: { $ref: "#/components/schemas/PredictionOutcome" }
        evaluation: { $ref: "#/components/schemas/ModelEvaluation" }
        calibration:
          type: array
          description: Reliability diagram for the `UP` class.
          items: { $ref: "#/components/schemas/CalibrationBin" }

    Fill:
      type: object
      required: [quantity, price, commission, slippage_bps, at]
      properties:
        quantity: { type: number }
        price: { type: number }
        commission: { type: number }
        slippage_bps: { type: number }
        at: { type: string, format: date-time }

    PaperOrder:
      type: object
      description: A simulated order. There is no real-money counterpart anywhere in this repository.
      required: [id, portfolio_id, idempotency_key, ticker, side, type, quantity, time_in_force, status, filled_qty, avg_fill_price, commission, slippage_bps, created_at, updated_at]
      properties:
        id: { type: string }
        portfolio_id: { type: string }
        idempotency_key:
          type: string
          description: |
            The client's key, namespaced server-side as `api:<key>`. Resubmitting
            the same key returns this same order rather than creating another,
            which is what makes submission safe to retry.
        ticker: { $ref: "#/components/schemas/Ticker" }
        side: { $ref: "#/components/schemas/OrderSide" }
        type: { $ref: "#/components/schemas/OrderType" }
        quantity: { type: number }
        limit_price: { type: number }
        stop_price: { type: number }
        time_in_force: { type: string }
        status: { $ref: "#/components/schemas/OrderStatus" }
        filled_qty: { type: number }
        avg_fill_price: { type: number }
        commission: { type: number }
        slippage_bps:
          type: number
          description: 'Modelled execution cost against the reference price, so simulated fills are not free.'
        reject_reason: { type: string }
        signal_id:
          type: string
          description: 'Set when the order came from a signal rather than from this API.'
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        fills:
          type: array
          items: { $ref: "#/components/schemas/Fill" }

    PaperPosition:
      type: object
      required: [portfolio_id, ticker, quantity, avg_price, market_price, market_value, cost_basis, unrealized_pnl, realized_pnl, opened_at, updated_at]
      properties:
        portfolio_id: { type: string }
        ticker: { $ref: "#/components/schemas/Ticker" }
        quantity:
          type: number
          description: 'Negative for a short position.'
        avg_price: { type: number }
        market_price: { type: number }
        market_value: { type: number }
        cost_basis: { type: number }
        unrealized_pnl: { type: number }
        realized_pnl: { type: number }
        opened_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        signal_id: { type: string }
        sector: { type: string }

    EquityPoint:
      type: object
      required: [at, equity, cash, drawdown, exposure]
      properties:
        at: { type: string, format: date-time }
        equity: { type: number }
        cash: { type: number }
        drawdown:
          type: number
          description: 'Fractional decline from the running peak at this point.'
        exposure:
          type: number
          description: 'Gross exposure as a fraction of equity.'

    Portfolio:
      type: object
      description: The simulated account.
      required: [id, name, currency, as_of, starting_cash, cash, equity, market_value, realized_pnl, unrealized_pnl, total_pnl, return_pct, gross_exposure, net_exposure, long_exposure, short_exposure, leverage, peak_equity, drawdown, max_drawdown, paper]
      properties:
        id: { type: string }
        name: { type: string }
        owner: { type: string }
        currency: { type: string }
        as_of: { type: string, format: date-time }
        starting_cash: { type: number }
        cash: { type: number }
        equity: { type: number }
        market_value: { type: number }
        realized_pnl: { type: number }
        unrealized_pnl: { type: number }
        total_pnl: { type: number }
        return_pct: { type: number }
        gross_exposure:
          type: number
          description: 'Long plus short, as a fraction of equity.'
        net_exposure:
          type: number
          description: 'Long minus short.'
        long_exposure: { type: number }
        short_exposure: { type: number }
        leverage: { type: number }
        peak_equity: { type: number }
        drawdown:
          type: number
          description: 'Current fractional decline from `peak_equity`. The risk engine''s drawdown check reads this.'
        max_drawdown: { type: number }
        sector_exposure:
          type: object
          description: Fraction of equity by sector. The concentration check reads this to refuse a signal that would over-weight one sector.
          additionalProperties: { type: number }
        positions:
          type: array
          items: { $ref: "#/components/schemas/PaperPosition" }
        paper:
          type: boolean
          const: true
          description: 'Always true. It is a field rather than an assumption so no consumer can mistake this book for a real one.'

    PortfolioResponse:
      type: object
      required: [portfolio, equity_curve, trades]
      properties:
        portfolio: { $ref: "#/components/schemas/Portfolio" }
        equity_curve:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/EquityPoint" }
        trades:
          type: [array, "null"]
          description: Closed round trips.
          items: { $ref: "#/components/schemas/BacktestTrade" }

    CostModel:
      type: object
      description: |
        Transaction costs and slippage. The shipped defaults are deliberately
        pessimistic: optimistic cost assumptions are the most common way a
        backtest lies.
      required: [commission_bps, commission_per_share, min_commission, spread_cost_bps, slippage_model, slippage_bps, impact_coefficient, borrow_rate_annual, participation_cap]
      properties:
        commission_bps: { type: number }
        commission_per_share: { type: number }
        min_commission: { type: number }
        spread_cost_bps:
          type: number
          description: 'Assumed cost of crossing the spread, charged even where the simulated book looks tight.'
        slippage_model:
          type: string
          enum: ["", fixed, sqrt_impact]
          description: '`sqrt_impact` scales cost with the square root of participation; `fixed` charges `slippage_bps` flat.'
        slippage_bps: { type: number }
        impact_coefficient: { type: number }
        borrow_rate_annual:
          type: number
          description: 'Charged on short exposure, so shorting is not modelled as free.'
        participation_cap:
          type: number
          description: 'Maximum fraction of a bar''s volume the simulator will fill, which stops a backtest transacting size the market never offered.'

    BacktestMetrics:
      type: object
      required: [total_return, cagr, sharpe, sortino, calmar, max_drawdown, max_drawdown_days, volatility, win_rate, profit_factor, expectancy, turnover, avg_exposure, trades, avg_hold_hours, total_costs]
      properties:
        total_return: { type: number }
        cagr: { type: number }
        sharpe: { type: number }
        sortino:
          type: number
          description: 'Like Sharpe but penalising downside deviation only.'
        calmar:
          type: number
          description: 'CAGR over maximum drawdown.'
        max_drawdown: { type: number }
        max_drawdown_days: { type: number }
        volatility: { type: number }
        win_rate: { type: number }
        profit_factor: { type: number }
        expectancy:
          type: number
          description: 'Mean profit per trade.'
        turnover: { type: number }
        avg_exposure: { type: number }
        trades: { type: integer }
        avg_hold_hours: { type: number }
        total_costs: { type: number }
        deflated_sharpe:
          type: number
          description: |
            Sharpe adjusted for the number of configurations tried. Reported on
            parameter sweeps so a lucky parameter set is visibly discounted
            rather than presented as a discovery.
        trials_considered:
          type: integer
          description: 'How many configurations the deflation accounts for.'

    BacktestTrade:
      type: object
      required: [ticker, side, entry_at, exit_at, entry_price, exit_price, quantity, pnl, return_pct, costs, hold_period, regime, exit_reason]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        side: { $ref: "#/components/schemas/Side" }
        entry_at: { type: string, format: date-time }
        exit_at: { type: string, format: date-time }
        entry_price: { type: number }
        exit_price: { type: number }
        quantity: { type: number }
        pnl: { type: number }
        return_pct: { type: number }
        costs: { type: number }
        hold_period:
          type: integer
          format: int64
          description: 'Nanoseconds held.'
        regime:
          allOf: [{ $ref: "#/components/schemas/Regime" }]
          description: The regime in force at entry, which is what makes per-regime attribution possible.
        signal_id: { type: string }
        exit_reason:
          type: string
          description: 'Which invalidation, target or stop ended the trade.'

    BacktestRun:
      type: object
      description: One deterministic historical simulation.
      required: [id, name, status, strategy_id, universe, start, end, interval, seed, config_hash, model_version, code_version, starting_cash, costs, metrics, created_at, events_processed]
      properties:
        id: { type: string }
        name: { type: string }
        status: { $ref: "#/components/schemas/BacktestStatus" }
        strategy_id: { type: string }
        universe:
          type: [array, "null"]
          description: The instruments the run covered. Null on a freshly queued run, before resolution.
          items: { $ref: "#/components/schemas/Ticker" }
        start: { type: string, format: date-time }
        end: { type: string, format: date-time }
        interval: { $ref: "#/components/schemas/Interval" }
        seed:
          type: integer
          format: int64
          description: |
            The determinism seed. Omitting it, or passing zero, makes the
            runner derive one from the request itself — a zero seed would make
            the run non-reproducible in the one way that matters.
        config_hash: { type: string }
        model_version: { type: string }
        code_version: { type: string }
        starting_cash: { type: number }
        costs: { $ref: "#/components/schemas/CostModel" }
        metrics: { $ref: "#/components/schemas/BacktestMetrics" }
        regime_metrics:
          type: object
          description: |
            Performance partitioned by regime. Usually where a strategy's real
            behaviour shows: a headline Sharpe that survives only in one regime
            is not a number to plan around.
          additionalProperties: { $ref: "#/components/schemas/BacktestMetrics" }
        equity_curve:
          type: array
          items: { $ref: "#/components/schemas/EquityPoint" }
        trades:
          type: array
          items: { $ref: "#/components/schemas/BacktestTrade" }
        created_at: { type: string, format: date-time }
        started_at:
          type: string
          format: date-time
          description: 'Zero-valued (`0001-01-01T00:00:00Z`) while the run is still queued.'
        completed_at:
          type: string
          format: date-time
          description: 'Zero-valued until the run finishes.'
        error:
          type: string
          description: 'Present on `FAILED`.'
        events_processed: { type: integer, format: int64 }
        result_hash:
          type: string
          description: 'Hash of the run''s output. Compare it across two runs with the same determinism inputs to confirm reproducibility.'

    AuditEvent:
      type: object
      description: One recorded state-changing action.
      required: [id, at, principal, action, resource, outcome]
      properties:
        id: { type: string }
        at: { type: string, format: date-time }
        principal:
          type: string
          description: 'The authenticated subject, or `anonymous`.'
        action:
          type: string
          description: 'The HTTP method and path, e.g. `POST /api/v1/paper/orders`.'
        resource: { type: string }
        outcome:
          type: string
          enum: [success, failure]
          description: '`failure` at status 400 and above. Rejected writes are recorded too — a security record that holds only the successes is not one.'
        request_id: { type: string }
        trace_id:
          type: string
          description: 'W3C trace id, so an audit record joins to the distributed trace of the same request.'
        detail:
          type: object
          additionalProperties: { type: string }
        remote_ip: { type: string }
    Condition:
      type: object
      description: |
        One machine-evaluable predicate over a feature snapshot. Either a
        literal (`value`, and `value2` for the two-bound operators) or another
        feature (`other`) is the right-hand side.
      required: [feature, op]
      properties:
        feature:
          type: string
          description: 'Feature name. Must be one the feature engine produces; an unknown name is a load-time error, never a rule that silently never fires.'
        op: { $ref: "#/components/schemas/Comparator" }
        value:
          type: number
          description: 'Literal right-hand side, or the lower bound for `between` and `outside`.'
        value2:
          type: number
          description: 'Upper bound for `between` and `outside`. Must differ from `value`.'
        other:
          type: string
          description: 'Another feature to compare against instead of a literal.'
        scale:
          type: number
          description: 'Multiplies `other` before comparison, so `last > 1.02 × sma_50` is expressible without inventing a feature. Defaults to 1.'
        optional:
          type: boolean
          description: |
            A cold or absent feature does not skip the rule. Use it where a
            condition adds confirmation but its absence should not silence the
            rule entirely.
        describe:
          type: string
          description: 'Overrides the generated evidence sentence for this condition.'

    Rule:
      type: object
      description: A named conjunction of conditions with a directional weight.
      required: [id, description, side, weight]
      properties:
        id:
          type: string
          description: 'Unique within the strategy. Appears in a signal''s `rules_fired`.'
        description:
          type: string
          description: 'Shown to users as evidence, so it should read as a statement about the market.'
        side: { $ref: "#/components/schemas/Side" }
        weight:
          type: number
          exclusiveMinimum: 0
          description: 'Must be positive. Direction comes from `side`, never from the sign of the weight.'
        all:
          type: array
          description: Every condition must hold.
          items: { $ref: "#/components/schemas/Condition" }
        any:
          type: array
          description: At least one condition must hold.
          items: { $ref: "#/components/schemas/Condition" }
        none:
          type: array
          description: No condition may hold.
          items: { $ref: "#/components/schemas/Condition" }
        regimes:
          type: array
          description: |
            Regimes in which this rule is evaluated at all. Empty means
            regime-agnostic. This is how the platform avoids applying
            indicators blindly; an excluded rule is reported as skipped rather
            than silently dropped.
          items: { $ref: "#/components/schemas/Regime" }
        counter:
          type: boolean
          description: |
            The rule argues *against* the strategy's thesis. When it fires it
            subtracts from the side it opposes and is surfaced in the
            explanation as counter-evidence.
        enabled:
          type: boolean
          description: 'Defaults to true when omitted.'

    ScoreWeights:
      type: object
      description: |
        Relative weights for the composite score's ten components. They need
        not sum to anything in particular — they are renormalised, including
        when a component is missing.
      required: [fundamental, growth, quality, valuation, technical, momentum, sector, market_regime, risk, event_risk]
      properties:
        fundamental: { type: number, minimum: 0 }
        growth: { type: number, minimum: 0 }
        quality: { type: number, minimum: 0 }
        valuation: { type: number, minimum: 0 }
        technical: { type: number, minimum: 0 }
        momentum: { type: number, minimum: 0 }
        sector: { type: number, minimum: 0 }
        market_regime: { type: number, minimum: 0 }
        risk: { type: number, minimum: 0 }
        event_risk: { type: number, minimum: 0 }

    SignalPolicy:
      type: object
      description: The gates rule output must clear before it becomes a signal candidate.
      required: [min_rule_score, min_final_score, min_confidence, min_directional_edge, min_risk_reward, horizon, stop_atr_multiple, target_atr_multiple, max_weight, cooldown_minutes, allow_short]
      properties:
        min_rule_score:
          type: number
          description: 'Minimum net directional rule score, 0..100.'
        min_final_score:
          type: number
          description: 'Minimum composite stock score.'
        min_confidence:
          type: number
          minimum: 0
          maximum: 1
          description: 'Minimum prediction confidence — the max-probability margin, not `1 - uncertainty`.'
        min_directional_edge:
          type: number
          description: 'Minimum `P(up) - P(down)`. Distinct from confidence: `0.40/0.35/0.25` and `0.40/0.20/0.40` carry different information at the same argmax.'
        min_risk_reward:
          type: number
          description: 'Minimum target distance over stop distance.'
        horizon: { $ref: "#/components/schemas/Horizon" }
        stop_atr_multiple:
          type: number
          exclusiveMinimum: 0
          description: 'Stop distance in ATRs. Must be positive — a signal without a stop reference has no risk/reward.'
        target_atr_multiple:
          type: number
          exclusiveMinimum: 0
          description: 'Target distance in ATRs.'
        max_weight:
          type: number
          exclusiveMinimum: 0
          maximum: 1
          description: 'Ceiling on `suggested_weight`, as a fraction of simulated equity.'
        cooldown_minutes:
          type: integer
          description: 'Minimum gap between signals on the same instrument, which stops one condition producing a stream of near-identical signals.'
        allow_short:
          type: boolean
          description: 'When false, a short-side conclusion is recorded as a rejection rather than emitted.'

    InvalidationTemplate:
      type: object
      description: |
        An invalidation condition in configuration terms; the signal engine
        resolves it against live values at emission time. At least one is
        required per strategy.
      required: [kind, description]
      properties:
        kind: { $ref: "#/components/schemas/InvalidationKind" }
        ref:
          type: string
          enum: [entry, vwap, atr, confidence, regime]
          description: 'What the threshold is measured relative to.'
        multiple:
          type: number
          description: 'Multiplier applied to `ref`, e.g. 1.5 ATRs below the entry reference.'
        value:
          type: number
          description: 'Absolute threshold, where the kind takes one directly.'
        minutes:
          type: integer
          description: 'Used by `TIME_EXPIRY`.'
        description:
          type: string
          description: 'Required, because it is shown to users.'

    FundamentalPolicy:
      type: object
      description: |
        The fundamental bands this strategy scores against, so "quality" means
        whatever this strategy says it means rather than a platform-wide
        constant.
      properties:
        min_revenue_growth: { type: number }
        min_eps_growth: { type: number }
        min_gross_margin: { type: number }
        min_operating_margin: { type: number }
        min_roe: { type: number }
        min_roic: { type: number }
        max_debt_to_equity: { type: number }
        min_current_ratio: { type: number }
        max_pe: { type: number }
        max_peg: { type: number }
        max_ev_to_ebitda: { type: number }
        prefer_low_valuation:
          type: boolean
          description: 'Whether a low multiple raises the valuation sub-score or is treated as neutral.'

    Strategy:
      type: object
      description: |
        A fully configuration-driven research strategy. No strategy logic lives
        in Go source, which is what makes a strategy reviewable by someone who
        does not read Go, versionable in git and diffable in a pull request.
      required: [id, name, version, description, enabled, interval, rules, weights, policy, invalidation]
      properties:
        id: { type: string }
        name: { type: string }
        version:
          type: string
          description: 'Required — a strategy without a version cannot be attributed to a historical signal.'
        description:
          type: string
        enabled: { type: boolean }
        universe:
          type: array
          description: Restricts the strategy to named instruments. Empty means the whole configured universe.
          items: { type: string }
        interval: { $ref: "#/components/schemas/Interval" }
        regimes:
          type: array
          description: Regimes in which the whole strategy is evaluated. Empty means regime-agnostic.
          items: { $ref: "#/components/schemas/Regime" }
        rules:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/Rule" }
        weights: { $ref: "#/components/schemas/ScoreWeights" }
        policy: { $ref: "#/components/schemas/SignalPolicy" }
        invalidation:
          type: array
          minItems: 1
          items: { $ref: "#/components/schemas/InvalidationTemplate" }
        fundamental: { $ref: "#/components/schemas/FundamentalPolicy" }
        source_path:
          type: string
          description: 'The file the strategy was loaded from.'
        hash:
          type: string
          description: 'Content hash of the file, stamped on signals so a past decision names the exact definition that produced it.'
        modified_at:
          type: string
          format: date-time
          description: |
            The file's modification time, not the time it was read. A load
            timestamp changes on every restart while saying nothing about which
            rules ran.

    ValuationMetrics:
      type: object
      required: [ticker, as_of, price, pe, forward_pe, peg, ev_to_ebitda, price_to_fcf,
                 price_to_sales, price_to_book, earnings_yield, fcf_yield,
                 historical_percentile, sector_percentile, history_periods, available,
                 valuation_score, valuation_explanation]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        as_of: { type: string, format: date-time }
        price: { type: number }
        pe: { type: number }
        forward_pe: { type: number }
        peg: { type: number }
        ev_to_ebitda: { type: number }
        price_to_fcf: { type: number }
        price_to_sales: { type: number }
        price_to_book: { type: number }
        earnings_yield: { type: number }
        fcf_yield: { type: number }
        historical_percentile:
          type: number
          minimum: 0
          maximum: 1
          description: 'The primary multiple against the instrument''s own history: 0.9 means more expensive than 90% of its own past.'
        sector_percentile: { type: number, minimum: 0, maximum: 1 }
        history_periods: { type: integer }
        available:
          type: object
          description: Which metrics were computable. Present because zero and unknown are different, and conflating them silently corrupts scores.
          additionalProperties: { type: boolean }
        valuation_score: { type: number }
        valuation_explanation: { type: string }

    OptionsMetrics:
      type: object
      description: |
        The options surface where data is available. Every reading carries an
        explicit confidence and data-quality marker, because options data is
        frequently sparse and unreliable.
      required: [ticker, as_of, implied_vol, iv_rank, iv_percentile, put_call_ratio,
                 open_interest, volume, skew_25d, delta, gamma, theta, vega,
                 data_quality, confidence]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        as_of: { type: string, format: date-time }
        implied_vol: { type: number }
        iv_rank:
          type: number
          minimum: 0
          maximum: 1
          description: 'Against the trailing 52 weeks.'
        iv_percentile: { type: number }
        put_call_ratio: { type: number }
        open_interest: { type: number }
        volume: { type: number }
        skew_25d: { type: number }
        delta: { type: number }
        gamma: { type: number }
        theta: { type: number }
        vega: { type: number }
        data_quality:
          type: string
          enum: [none, partial, good]
          description: 'Bounds `confidence` — a partial surface can never report high confidence.'
        confidence: { type: number, minimum: 0, maximum: 1 }
        caveats:
          type: array
          description: |
            What explicitly cannot be inferred from this surface, so downstream
            prose cannot claim institutional positioning from open interest.
          items: { type: string }

    AnalystReport:
      type: object
      description: |
        The narrative layer. It is produced after a decision is final and can
        change no number; it exists to explain, never to decide.
      required: [ticker, generated_at, summary, supporting_evidence, counter_evidence, uncertainty, risks, scenarios, source, disclaimer]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        generated_at: { type: string, format: date-time }
        summary: { type: string }
        supporting_evidence:
          type: array
          items: { type: string }
        counter_evidence:
          type: array
          items: { type: string }
        uncertainty:
          type: string
          description: 'What the platform does not know about this instrument, stated plainly.'
        risks:
          type: array
          items: { type: string }
        scenarios:
          type: array
          items: { type: string }
        source:
          type: string
          description: 'Which layer wrote it — a deterministic template or a named language model.'
        model: { type: string }
        rejected:
          type: string
          description: |
            Why a language-model narrative was discarded, when one was. It is
            surfaced rather than hidden: a silently replaced explanation is a
            trust problem.
        disclaimer:
          type: string
        grounding:
          $ref: "#/components/schemas/GroundingReport"

    GroundingReport:
      type: object
      description: |
        The grounding validator's report, retained for audit. Every number the
        narrative states is checked against the structured record it claims to
        describe, so prose cannot introduce a figure that is not in the data.
      required: [ok, numbers_checked, fact_count, tolerance]
      properties:
        ok:
          type: boolean
          description: Every number in the prose was matched to a fact in the record.
        numbers_checked:
          type: integer
          description: How many numeric claims the validator extracted from the prose.
        ungrounded:
          type: array
          description: The claims that matched nothing. A non-empty list is why a narrative was rejected.
          items: { type: string }
        fact_count:
          type: integer
          description: How many facts from the record were available to match against.
        tolerance:
          type: number
          description: Relative tolerance allowed when matching a stated number to a recorded one, so rounding in the prose is not treated as fabrication.

    InstrumentView:
      type: object
      description: Everything the platform holds for one instrument, assembled from the read model.
      required: [stock, updated_at]
      properties:
        stock: { $ref: "#/components/schemas/Stock" }
        features: { $ref: "#/components/schemas/FeatureSnapshot" }
        score: { $ref: "#/components/schemas/StockScore" }
        prediction: { $ref: "#/components/schemas/Prediction" }
        risk: { $ref: "#/components/schemas/RiskAssessment" }
        opportunity: { $ref: "#/components/schemas/OpportunityScore" }
        valuation: { $ref: "#/components/schemas/ValuationMetrics" }
        options: { $ref: "#/components/schemas/OptionsMetrics" }
        signals:
          type: array
          items: { $ref: "#/components/schemas/Signal" }
        news:
          type: array
          items: { $ref: "#/components/schemas/NewsEvent" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CorporateEvent" }
        explanation: { $ref: "#/components/schemas/AnalystReport" }
        evidence:
          type: array
          description: Rule descriptions that fired for this instrument, with the values that satisfied them.
          items: { type: string }
        counter_evidence:
          type: array
          description: Rules that fired against the thesis.
          items: { type: string }
        updated_at: { type: string, format: date-time }

    Ranked:
      type: object
      description: One row of the ranked instrument list.
      required: [ticker, company, sector, last, score, opportunity, classification, bias, confidence, risk, risk_decision, probability, stale, updated_at]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        company: { type: string }
        sector: { type: string }
        last: { type: number }
        score:
          type: number
          description: 'The composite stock score.'
        opportunity:
          type: number
          description: 'The opportunity score, which is what the list is ordered by.'
        classification: { $ref: "#/components/schemas/Classification" }
        bias: { $ref: "#/components/schemas/Side" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        risk: { $ref: "#/components/schemas/RiskLevel" }
        risk_decision: { $ref: "#/components/schemas/RiskDecision" }
        probability: { $ref: "#/components/schemas/Distribution" }
        stale: { type: boolean }
        rejection:
          type: string
          description: |
            The stage and reason the platform declined to emit a signal, e.g.
            `rule_score: rule score 25.0 is below the strategy minimum of 40.0`.
            It is exported because "produced nothing" and "declined for these
            reasons" look identical from outside and mean entirely different
            things.
        updated_at: { type: string, format: date-time }

    Provenance:
      type: object
      description: The complete causal record behind one signal.
      required: [signal, reproducible, note]
      properties:
        signal: { $ref: "#/components/schemas/Signal" }
        feature_snapshot: { $ref: "#/components/schemas/FeatureSnapshot" }
        feature_snapshot_error:
          type: string
          description: 'Why the snapshot could not be retrieved, when it could not.'
        prediction: { $ref: "#/components/schemas/Prediction" }
        risk_assessment: { $ref: "#/components/schemas/RiskAssessment" }
        regime: { $ref: "#/components/schemas/MarketRegime" }
        model_version: { $ref: "#/components/schemas/ModelVersion" }
        strategy: { $ref: "#/components/schemas/Strategy" }
        outcomes:
          type: array
          description: Realised outcomes for this signal's prediction, once their horizons have elapsed.
          items: { $ref: "#/components/schemas/PredictionOutcome" }
        reproducible:
          type: boolean
          description: |
            Whether every input needed to re-derive the decision is present.
            Read this first: when false, `missing` names what is absent and
            `note` says the decision cannot be fully reproduced.
        missing:
          type: array
          description: The inputs that could not be retrieved.
          items: { type: string }
        explanation: { type: string }
        note:
          type: string
          description: 'A plain-language statement of what this record does or does not establish. Its text changes with `reproducible`.'

    ModelVersion:
      type: object
      description: The registry record for one trained artifact.
      required: [id, model_id, version, family, stage, artifact_uri, artifact_sha, features, horizon, flat_band_bps, train_start, train_end, valid_start, valid_end, test_start, test_end, trained_at, registered_at, out_of_sample]
      properties:
        id: { type: string }
        model_id: { type: string }
        version: { type: string }
        family: { $ref: "#/components/schemas/ModelFamily" }
        stage: { $ref: "#/components/schemas/ModelStage" }
        artifact_uri: { type: string }
        artifact_sha: { type: string }
        features:
          type: array
          items: { type: string }
        horizon: { $ref: "#/components/schemas/Horizon" }
        flat_band_bps: { type: number }
        train_start: { type: string, format: date-time }
        train_end: { type: string, format: date-time }
        valid_start: { type: string, format: date-time }
        valid_end: { type: string, format: date-time }
        test_start:
          type: string
          format: date-time
          description: 'The split the model never saw, which is the only one `out_of_sample` may be computed on.'
        test_end: { type: string, format: date-time }
        trained_at: { type: string, format: date-time }
        registered_at: { type: string, format: date-time }
        promoted_at: { type: string, format: date-time }
        training_commit:
          type: string
          description: 'The commit the training run was made from, so an artifact traces back to code.'
        hyperparameters:
          type: object
          additionalProperties: { type: number }
        canary_fraction:
          type: number
          description: 'The stable fraction of symbols a canary serves.'
        out_of_sample: { $ref: "#/components/schemas/ModelEvaluation" }
        by_regime:
          type: object
          additionalProperties: { $ref: "#/components/schemas/ModelEvaluation" }
        notes: { type: string }
    BriefOpportunity:
      type: object
      description: One ranked entry in the brief.
      required: [ticker, company, sector, score, classification, bias, probability, horizon, confidence, risk, risk_decision, reasons, counter_signals]
      properties:
        ticker: { $ref: "#/components/schemas/Ticker" }
        company: { type: string }
        sector: { type: string }
        score: { type: number }
        classification: { $ref: "#/components/schemas/Classification" }
        bias: { $ref: "#/components/schemas/Side" }
        probability: { $ref: "#/components/schemas/Distribution" }
        horizon: { $ref: "#/components/schemas/Horizon" }
        confidence: { type: number, minimum: 0, maximum: 1 }
        risk: { $ref: "#/components/schemas/RiskLevel" }
        risk_decision: { $ref: "#/components/schemas/RiskDecision" }
        reasons:
          type: [array, "null"]
          items: { type: string }
        counter_signals:
          type: [array, "null"]
          description: Listed beside the reasons rather than in a separate section, so a reader cannot see one without the other.
          items: { type: string }
        important_events:
          type: array
          items: { type: string }

    MarketOverview:
      type: object
      required: [as_of, regime, benchmarks, vix, breadth, sector_rotation, rotation]
      properties:
        as_of: { type: string, format: date-time }
        regime: { $ref: "#/components/schemas/MarketRegime" }
        benchmarks:
          type: [object, "null"]
          description: Benchmark returns keyed by ticker.
          additionalProperties: { type: number }
        vix: { type: number }
        breadth: { type: number }
        sector_rotation:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/SectorPerformance" }
        rotation: { type: string }
        divergences:
          type: array
          items: { $ref: "#/components/schemas/Divergence" }
        notes:
          type: array
          items: { type: string }

    PredictionSummary:
      type: object
      description: The forecasting record over the reporting period.
      required: [resolved, accuracy, base_rate, brier_score, calibration, veto_cost, interpretation]
      properties:
        resolved: { type: integer }
        accuracy: { type: number }
        base_rate:
          type: number
          description: 'Reported beside accuracy, because accuracy alone on a three-class problem is not interpretable.'
        brier_score: { type: number }
        calibration: { type: number }
        best_regime: { type: string }
        worst_regime:
          type: string
          description: 'Named explicitly — where a model is worst is more useful than its average.'
        veto_cost: { $ref: "#/components/schemas/VetoCost" }
        interpretation:
          type: string
          description: 'The record stated in words, including when there is too little evidence to state one.'

    ModelConfidence:
      type: object
      required: [model_version, stage, healthy, drift, serving_from_fallback]
      properties:
        model_version: { type: string }
        stage: { $ref: "#/components/schemas/ModelStage" }
        healthy: { type: boolean }
        drift: { $ref: "#/components/schemas/DriftSeverity" }
        issues:
          type: array
          items: { type: string }
        serving_from_fallback:
          type: boolean
          description: |
            No trained model is contributing and the deterministic rule prior
            is being served alone. Surfaced because the difference matters to
            how much weight a reader should give the numbers.

    Brief:
      type: object
      description: |
        The assembled market report. Composed from structured artifacts only —
        the prose inherits the grounding validator, so it cannot contain a
        number that is not in the record, and the language guard, so it cannot
        tell anyone to buy anything.
      required: [id, generated_at, trading_day, title, market_overview, prediction_summary, model_confidence, narrative, narrative_source, disclaimer]
      properties:
        id: { type: string }
        generated_at: { type: string, format: date-time }
        trading_day:
          type: string
          description: 'The session the brief describes, `YYYY-MM-DD`.'
        title: { type: string }
        market_overview: { $ref: "#/components/schemas/MarketOverview" }
        major_macro_events:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/NewsEvent" }
        sector_leaders:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/SectorPerformance" }
        top_opportunities:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/BriefOpportunity" }
        high_risk:
          type: [array, "null"]
          description: Instruments the platform is flagging as risky, given equal prominence to the opportunities.
          items: { $ref: "#/components/schemas/BriefOpportunity" }
        important_earnings:
          type: [array, "null"]
          items: { $ref: "#/components/schemas/CorporateEvent" }
        prediction_summary: { $ref: "#/components/schemas/PredictionSummary" }
        model_confidence: { $ref: "#/components/schemas/ModelConfidence" }
        risk_warnings:
          type: [array, "null"]
          items: { type: string }
        narrative: { type: string }
        narrative_source:
          type: string
          description: 'Which layer wrote the prose, so a reader always knows what they are reading.'
        disclaimer: { type: string }

    ComponentHealth:
      type: object
      required: [enabled, healthy]
      properties:
        enabled:
          type: boolean
          description: 'Whether this backing store is configured at all. A disabled component is reported healthy — it is not failing, it is absent.'
        healthy: { type: boolean }
        latency:
          type: integer
          format: int64
          description: 'Probe round-trip in nanoseconds.'
        error: { type: string }

    StoreHealth:
      type: object
      required: [postgres, clickhouse, redis]
      properties:
        postgres: { $ref: "#/components/schemas/ComponentHealth" }
        clickhouse: { $ref: "#/components/schemas/ComponentHealth" }
        redis: { $ref: "#/components/schemas/ComponentHealth" }
        degraded:
          type: array
          items: { type: string }

    HealthResponse:
      type: object
      required: [status, version, mode, uptime, stream_clients, timestamp]
      properties:
        status:
          type: string
          enum: [ok, degraded]
          description: '`degraded` when any subsystem has reported itself unavailable. The process is alive either way.'
        version: { type: string }
        mode:
          type: string
          enum: [embedded, compose, cluster]
          description: 'Which drivers are in use. `embedded` is the in-process bus and store.'
        uptime:
          type: string
          description: 'Go duration string truncated to the second, e.g. `44s`.'
        degraded:
          type: array
          items: { type: string }
        store: { $ref: "#/components/schemas/StoreHealth" }
        stream_clients:
          type: integer
          description: 'Currently connected SSE clients.'
        timestamp: { type: string, format: date-time }

    Principal:
      type: object
      description: An authenticated caller.
      required: [sub, roles, scopes, expires_at, issuer]
      properties:
        sub:
          type: string
          description: 'The subject claim — the identity the audit log records.'
        name: { type: string }
        roles:
          type: array
          description: |
            Roles from the token. `viewer` reads market, signals, models and the
            paper book; `analyst` adds `backtest:run`; `operator` adds
            `paper:write` and `audit:read`; `admin` adds configuration and model
            management.
          items: { type: string, enum: [viewer, analyst, operator, admin] }
        scopes:
          type: array
          description: The scopes those roles grant, resolved from a single authorisation table so "who can do what" is answerable by reading one place.
          items:
            type: string
            enum: ["market:read", "signals:read", "models:read", "portfolio:read", "backtest:run", "paper:write", "config:write", "models:write", "audit:read"]
        expires_at: { type: string, format: date-time }
        issuer: { type: string }

    LoginRequest:
      type: object
      required: [subject, password]
      properties:
        subject:
          type: string
          description: 'The configured development principal, e.g. `demo` or `operator`.'
        password: { type: string, format: password }

    LoginResponse:
      type: object
      required: [token, principal]
      properties:
        token:
          type: string
          description: |
            An HS256 JWT. Empty when authentication is disabled, in which case
            `principal` is the anonymous read-only identity.
        principal: { $ref: "#/components/schemas/Principal" }

    OrderRequest:
      type: object
      description: Unknown fields are rejected with 400 rather than ignored, so a typo is an error and not a silently dropped setting.
      required: [idempotency_key, ticker, side, quantity]
      properties:
        idempotency_key:
          type: string
          description: |
            Required. Resubmitting the same key returns the original order
            rather than creating a second one, which is what makes submission
            safe to retry after a timeout. Use a value that identifies the
            intent — a client-generated UUID per submission — not the ticker.
        ticker: { $ref: "#/components/schemas/Ticker" }
        side: { $ref: "#/components/schemas/OrderSide" }
        type:
          allOf: [{ $ref: "#/components/schemas/OrderType" }]
          description: Defaults to `MARKET`.
        quantity: { type: number, exclusiveMinimum: 0 }
        limit_price: { type: number }
        stop_price: { type: number }

    BacktestRequest:
      type: object
      description: Unknown fields are rejected with 400.
      required: [strategy_id, start, end]
      properties:
        name:
          type: string
          description: 'Defaults to `adhoc`.'
        strategy_id:
          type: string
          description: 'Must name a loaded strategy; see `GET /api/v1/strategies`.'
        start:
          type: string
          format: date-time
          description: 'RFC3339.'
        end:
          type: string
          format: date-time
          description: 'RFC3339, and must be after `start`.'
        interval:
          allOf: [{ $ref: "#/components/schemas/Interval" }]
          description: Defaults to `1m`.
        seed:
          type: integer
          format: int64
          description: |
            Determinism seed. Omit it, or pass 0, and the runner derives one
            from the request itself — a zero seed would make the run
            non-reproducible in the one way that matters.
        starting_cash: { type: number }
        tickers:
          type: array
          description: The instruments to run over. Normalised the same way as any other symbol.
          items: { $ref: "#/components/schemas/Ticker" }

    MarketStatusSummary:
      type: object
      required: [regime, regime_confidence, instruments, stale_instruments, as_of]
      properties:
        regime: { $ref: "#/components/schemas/Regime" }
        regime_confidence: { type: number }
        instruments:
          type: integer
          description: 'How many instruments the read model currently holds a snapshot for.'
        stale_instruments:
          type: integer
          description: |
            How many of those have aged past the freshness gate. The number
            worth watching: a stale instrument may still be displayed but can
            never produce a new signal.
        as_of: { type: string, format: date-time }

    StreamPayload:
      description: |
        The payload carried in one SSE frame's `data:` field. Which variant it
        is, is determined by the frame's `event:` name — SSE has no place to
        put a discriminator inside the JSON, so the event name is the type tag.
        `quote` frames carry an array; every other event carries one object.
      oneOf:
        - type: array
          description: "`quote` — a throttled batch, at most one frame every 500ms."
          items: { $ref: "#/components/schemas/Quote" }
        - $ref: "#/components/schemas/MarketRegime"
        - $ref: "#/components/schemas/Signal"
        - $ref: "#/components/schemas/Alert"
        - $ref: "#/components/schemas/Prediction"
        - $ref: "#/components/schemas/Portfolio"
        - type: object
          description: "`health` — the periodic model-health broadcast."
          properties:
            health: { $ref: "#/components/schemas/ModelHealth" }
            drift: { $ref: "#/components/schemas/DriftReport" }
        - type: object
          description: "`resync` and `overflow` control frames, which are unnumbered and carry only a reason."
          required: [reason]
          properties:
            reason: { type: string }
