openapi: 3.1.0
info:
  title: QuantOS API
  version: "1.0.0"
  summary: Research classifications, probabilistic forecasts and paper-trading simulation.
  description: |
    QuantOS is an educational research and paper-trading platform. Every route
    below returns research output: probability distributions, risk verdicts and
    simulated positions. Nothing here is advice, nothing is a guarantee, and no
    endpoint places a real-money order — `POST /api/v1/paper/orders` writes to a
    simulated book and has no brokerage counterpart anywhere in the system.

    Three things are true of every response and are worth reading once rather
    than rediscovering per endpoint.

    **The envelope is uniform.** A success carries `data`, an optional `meta`,
    an optional `degraded` list, a `disclaimer`, a `request_id` and `served_at`.
    A failure carries `error` (with `code`, `message`, optional `detail` and
    `request_id`) and a `disclaimer`. The two shapes never mix: if `error` is
    present, `data` is not.

    **`degraded` means the answer is partial, not wrong.** When a subsystem is
    unavailable the platform still answers, and names what was missing, rather
    than returning a complete-looking body assembled from less than it claims.

    **`disclaimer` is on the record, not only at the edge.** Signals, scores,
    opportunity scores, alerts and predictions each carry their own
    `disclaimer` field inside `data`, because a client that stores one of those
    objects and redisplays it later would otherwise have stripped the caveat.

    Authentication is OAuth2/OIDC in cluster deployments and locally-issued
    HS256 tokens in embedded and compose mode. `POST /api/v1/auth/login` exists
    only for the locally-configured development principals; a cluster
    deployment validates RS256 tokens against its issuer's JWKS and that route
    is not the way in.
  contact:
    name: QuantOS
  license:
    name: Proprietary

servers:
  - url: http://localhost:8080
    description: Local single-process build (`make run`), default listen address.
  - url: http://localhost:8092
    description: Any other local port, e.g. `quantos run --addr :8092`.

tags:
  - name: health
    description: Liveness, readiness and Prometheus metrics. Unauthenticated.
  - name: auth
    description: Token issue for locally-configured development principals.
  - name: market
    description: Regime, cross-asset relationships, instruments, bars and news.
  - name: signals
    description: Signals, their provenance, predictions, alerts and risk verdicts.
  - name: models
    description: Serving models, measured health, drift and loaded strategies.
  - name: paper
    description: The simulated portfolio, its positions and its orders.
  - name: backtests
    description: Deterministic historical simulation.
  - name: audit
    description: The append-only record of state-changing requests.
  - name: stream
    description: Server-Sent Events for dashboards.

security:
  - bearerAuth: []

paths:
  /healthz:
    get:
      tags: [health]
      operationId: health
      summary: Liveness and build identity.
      description: |
        Always answers 200 while the process is running. `status` is `degraded`
        rather than `ok` when any subsystem has reported itself unavailable —
        the process is alive either way, which is what a liveness probe asks.
      security: []
      responses:
        "200":
          description: The process is serving.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/HealthResponse" }
              example:
                data:
                  status: ok
                  version: dev
                  mode: embedded
                  uptime: 44s
                  store:
                    postgres: { enabled: false, healthy: true }
                    clickhouse: { enabled: false, healthy: true }
                    redis: { enabled: false, healthy: true }
                  stream_clients: 0
                  timestamp: "2026-08-28T03:20:47.301189664Z"
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: c907354e4adaee79
                served_at: "2026-08-28T03:20:47.301198576Z"

  /readyz:
    get:
      tags: [health]
      operationId: ready
      summary: Readiness — can the service serve its purpose?
      description: |
        Distinct from `/healthz` on purpose. A process that is alive but cannot
        reach the store it needs to record provenance is not ready to emit
        anything, and answering 200 there would keep traffic arriving at an
        instance that can only disappoint it.
      security: []
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: object
                        properties:
                          status: { type: string, const: ready }
              example:
                data: { status: ready }
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: "69882adeb948f784"
                served_at: "2026-08-28T03:21:51.859534416Z"
        "503":
          $ref: "#/components/responses/Unavailable"

  /metrics:
    get:
      tags: [health]
      operationId: metrics
      summary: Prometheus exposition.
      description: |
        The process registry in text exposition format. Mounted only when
        metrics are configured; absent otherwise, which is why a scraper should
        treat a 404 here as "not enabled" rather than as an error.
      security: []
      responses:
        "200":
          description: Metric families.
          content:
            text/plain:
              schema: { type: string }
              example: |
                # HELP quantos_alerts_generated_total Alerts emitted.
                # TYPE quantos_alerts_generated_total counter
                quantos_alerts_generated_total{type="DATA_STALE",severity="WARNING"} 104
                quantos_alerts_generated_total{type="MOMENTUM_SHIFT",severity="INFO"} 23

  /api/v1/auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Issue a token for a locally-configured development principal.
      description: |
        Present only for embedded and compose deployments, where QuantOS signs
        its own HS256 tokens for principals listed in `auth.dev_users`. Cluster
        mode requires a real OIDC issuer, and a token obtained anywhere other
        than that issuer will not verify.

        Failure is deliberately vague: a wrong password and an unknown subject
        both return the same 401 with `detail: "invalid credentials"`, because
        distinguishing them hands an attacker a user-enumeration oracle. The
        server also hashes a throwaway password for an unknown subject so the
        two paths take the same time.

        When authentication is disabled entirely the route answers 200 with an
        empty `token` and the anonymous principal, which holds the `viewer`
        scopes only — turning auth off must not silently grant write access.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
            example: { subject: demo, password: demo }
      responses:
        "200":
          description: A signed token and the principal it represents.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/LoginResponse" }
              example:
                data:
                  token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJhdWQiOiJxdWFudG9zLWFwaSIsImV4cCI6MTc4NzkzMDQ1MSwiaWF0IjoxNzg3ODg3MjUxLCJpc3MiOiJxdWFudG9zLWxvY2FsIiwicm9sZXMiOlsidmlld2VyIiwiYW5hbHlzdCJdLCJzdWIiOiJkZW1vIn0.Zr1MFlQNwsHliVEjmZQnDtRnOE28SZ6amdCaCx7kToM
                  principal:
                    sub: demo
                    roles: [viewer, analyst]
                    scopes: ["backtest:run", "market:read", "models:read", "portfolio:read", "signals:read"]
                    expires_at: "2026-08-28T15:20:51.691081214Z"
                    issuer: quantos-local
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: f8ed30b3ccbeed7d
                served_at: "2026-08-28T03:20:51.691135794Z"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          description: The credentials did not match a configured principal.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                error:
                  code: unauthorized
                  message: authentication is required
                  detail: invalid credentials
                  request_id: 05fec2f02ca7744e
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/market/regime:
    get:
      tags: [market]
      operationId: getRegime
      summary: The market regime currently in force.
      description: |
        A regime is a description of the environment that has been observed,
        not a forecast. It matters because every downstream threshold keys off
        it: strategies and individual rules declare which regimes they are
        meaningful in, and are skipped outside them.

        `meta.as_of` carries the regime's own timestamp. Before the first
        macro bar is processed the read model holds a zero-valued regime with
        an empty `regime` string — a fresh process answers 200 with that rather
        than 404, because "not classified yet" is a state, not a missing
        resource.
      responses:
        "200":
          description: The current regime with the inputs and per-regime scores that produced it.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MarketRegime" }
              example:
                data:
                  regime: RANGE
                  confidence: 0.7536001985395878
                  secondary: LOW_VOLATILITY
                  secondary_score: 0.6857825342465753
                  volatility: 0.07135273972602742
                  breadth: 0.09615384615384616
                  momentum: 0.1365778514750169
                  risk_appetite: 0.0433869146504823
                  liquidity: 0.5004080248214398
                  inputs:
                    vix: 16.0835
                    rsi: 44.991604854165054
                    breadth: 0.09615384615384616
                    primary_adx: 26.32720831640495
                    realized_vol: 0.08530525049231087
                  scores:
                    RANGE: 0.8996142079913519
                    LOW_VOLATILITY: 0.6857825342465753
                    BULL_TREND: 0.1237646162429105
                    BREAKOUT: 0.10508384477840685
                    RISK_ON: 0.053940300951155075
                    BEAR_TREND: 0
                    HIGH_VOLATILITY: 0
                    REVERSAL: 0
                    RISK_OFF: 0
                  evidence:
                    - SPY 20/50 moving averages agree with the trend direction
                    - SPY ADX at 26.3 indicates a directional market
                    - QQQ confirms the direction of SPY
                  as_of: "2026-08-28T03:21:00Z"
                  version: regime-v1
                  changed: false
                  previous_regime: LOW_VOLATILITY
                  stable_for: 7860000000000
                meta:
                  as_of: "2026-08-28T03:21:00Z"
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: 630cc5614d645559
                served_at: "2026-08-28T03:21:07.790430586Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/market/regime/history:
    get:
      tags: [market]
      operationId: listRegimeHistory
      summary: Recorded regime classifications, newest first.
      parameters:
        - $ref: "#/components/parameters/Limit100"
        - $ref: "#/components/parameters/From"
      responses:
        "200":
          description: |
            Historical regimes. `data` is `null` rather than `[]` when nothing
            has been recorded yet, and `meta.count` is omitted when it is zero.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: [array, "null"]
                        items: { $ref: "#/components/schemas/MarketRegime" }
              example:
                data: null
                meta: { limit: 2 }
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: 4cbc2dbc4be18989
                served_at: "2026-08-28T03:20:55.982354938Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/market/relationships:
    get:
      tags: [market]
      operationId: getRelationships
      summary: Cross-asset correlations, sector rotation and divergences.
      description: |
        The correlation map is keyed by a pair spelled `"A|B"` (for example
        `"SPY|QQQ"`). `divergences` names two series that normally move
        together and currently do not, which is usually more informative than
        either series alone.
      responses:
        "200":
          description: The cross-asset picture.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/RelationshipState" }
              example:
                data:
                  as_of: "2026-08-28T03:21:00Z"
                  correlation: { "SPY|QQQ": 0.94, "SPY|TLT": -0.31 }
                  correlation_change: { "SPY|TLT": -0.12 }
                  sectors:
                    - sector: Technology
                      etf: XLK
                      return_1d: 0.004
                      return_5d: 0.011
                      return_20d: 0.028
                      rel_strength: 0.6
                      breadth: 0.31
                      rank: 1
                  rotation: CYCLICAL_TO_DEFENSIVE
                  risk_on_score: 0.21
                meta:
                  as_of: "2026-08-28T03:21:00Z"
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: 630cc5614d645559
                served_at: "2026-08-28T03:20:55.990430586Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/market/status:
    get:
      tags: [market]
      operationId: getMarketStatus
      summary: One-line platform view of the market.
      description: |
        A deliberately small summary for a status bar: the regime and its
        confidence, how many instruments the read model holds, and how many of
        those are currently marked stale. `stale_instruments` is the number
        worth watching — a symbol whose data has aged past the freshness gate
        may still be displayed but can never produce a new signal.
      responses:
        "200":
          description: The summary. Note this response carries no `meta`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/MarketStatusSummary" }
              example:
                data:
                  regime: RANGE
                  regime_confidence: 0.7303030426807406
                  instruments: 115
                  stale_instruments: 0
                  as_of: "2026-08-28T03:22:00Z"
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: b3a5c4da0dbeca68
                served_at: "2026-08-28T03:22:58.098347935Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
  /api/v1/stocks:
    get:
      tags: [market]
      operationId: listStocks
      summary: Instruments ranked by opportunity score.
      description: |
        Ordering is opportunity descending with the ticker as a tiebreak, so
        the same state always produces the same list. A UI that reshuffles
        equal-scoring rows on every poll is a UI nobody trusts.

        Only instruments the pipeline has already scored appear here, so a
        freshly started process returns `[]` until the first bars are
        processed. `rejection` is the stage and reason the platform declined to
        emit a signal for that instrument; its absence means nothing was
        declined, not that a signal exists.
      parameters:
        - $ref: "#/components/parameters/Limit100"
        - name: sector
          in: query
          required: false
          description: Exact sector name to filter on, e.g. `Technology`. Unmatched values return an empty list rather than an error.
          schema: { type: string }
          example: Technology
      responses:
        "200":
          description: The ranked list.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: array
                        items: { $ref: "#/components/schemas/Ranked" }
              example:
                data:
                  - ticker: UNP
                    company: Union Pacific Corporation
                    sector: Industrials
                    last: 243.7453
                    score: 68.7
                    opportunity: 55.4
                    classification: NEUTRAL
                    bias: SHORT
                    confidence: 0.13
                    risk: LOW
                    risk_decision: WATCH_ONLY
                    probability: { up: 0.195924067184298, flat: 0.42068099510397355, down: 0.38339493771172845 }
                    stale: false
                    rejection: "direction: strategy mean_reversion does not permit short signals"
                    updated_at: "2026-08-28T03:21:00Z"
                meta: { count: 1, limit: 2 }
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: 017ba85cee958cd1
                served_at: "2026-08-28T03:21:07.774774284Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/stocks/{ticker}:
    get:
      tags: [market]
      operationId: getStock
      summary: Everything the platform holds for one instrument.
      description: |
        The composite view: the instrument record, its latest feature snapshot,
        composite score, prediction, risk assessment, opportunity score, the
        rule evidence and counter-evidence, recent news and the corporate-event
        calendar. `explanation` is the AI analyst's narrative and is present
        only for instruments that produced a signal — the analyst runs strictly
        after a decision is final and cannot influence a number.

        `meta.stale` and `meta.stale_reason` are lifted from the feature
        snapshot so a client can tell at the envelope level that the body
        describes an instrument whose data has aged out.
      parameters:
        - $ref: "#/components/parameters/TickerPath"
      responses:
        "200":
          description: The instrument view.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data: { $ref: "#/components/schemas/InstrumentView" }
              example:
