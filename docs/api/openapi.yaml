                    warm:
                      last: true
                      rsi_14: true
                      adx_14: true
                      bb_percent_b: true
                      vwap_dist_bps: true
                      realized_vol_20: true
                    last: 230.8745
                    bid: 230.8332
                    ask: 230.9158
                    volume: 2160557
                    spread_bps: 3.577605230752728
