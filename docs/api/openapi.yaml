  /api/v1/model-health:
    get:
      tags: [models]
      operationId: getModelHealth
      summary: Measured model health, drift and the cost of the risk veto.
      description: |
        `health.provisional` is the field that changes how the rest should be
        read. A newly promoted model has no live resolved predictions, and
        refusing to serve until it does means it never gets any; so its health
        is initially derived from its own offline test split. That is still a
        real measurement — made on data the model never saw — but under a
        different distribution, and it is replaced by live evidence as soon as
        enough predictions resolve.

        `veto_cost` measures what the risk engine's blocks cost. Comparing the
        realised accuracy and mean return of blocked predictions against
        allowed ones is the only way to tell a veto that is protecting the book
        from one that is merely suppressing good calls.

        `calibration` is `1 - ECE`, so higher is better, unlike `brier_score`.
      responses:
        "200":
          description: Health, drift, rolling evaluation, per-regime breakdown and veto cost.
          content:
