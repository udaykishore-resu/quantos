        With no `status`, or with `status=ACTIVE`, the answer comes from the
        signal engine, which is authoritative for the live set. Any other
        `status` reads history from the store.

        The engine does not index its live set, so `ticker`, `strategy`, `from`
        and `offset` are applied by hand over it. That is deliberate: silently
        ignoring `?ticker=` would be worse than not supporting it, because a
        caller would believe it had filtered.

        A signal cannot exist without an allowing risk assessment and at least
        one machine-checkable invalidation condition. Both are enforced at
        construction, not by convention, so `invalidations` is never empty and
        `risk_assessment_id` always resolves.
