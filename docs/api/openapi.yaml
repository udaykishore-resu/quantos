                served_at: "2026-08-28T03:21:17.665229321Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [backtests]
      operationId: createBacktest
      summary: Queue a deterministic historical simulation.
      description: |
        A backtest is minutes of CPU, so the API accepts it and returns `202`
        with a run id rather than holding the connection open. Tying an HTTP
        client's timeout to the workload's runtime is how a slow backtest
        becomes a gateway timeout and a confused user. Poll
        `GET /api/v1/backtests/{id}` for `status`.

        `seed` makes the run reproducible. Omit it, or pass `0`, and the runner
        derives one deterministically from the request itself — a zero seed
        would make the run non-reproducible in the one way that matters.

        `start` and `end` are RFC3339 and `end` must be after `start`.
        `strategy_id` must name a loaded strategy. `interval` defaults to `1m`
        and `name` defaults to `adhoc`. Unknown JSON fields are rejected.

        Costs are applied from a deliberately pessimistic default model —
        commission, spread, square-root impact slippage, borrow and a
        participation cap — because optimistic cost assumptions are the most
        common way a backtest lies.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/BacktestRequest" }
            example:
              name: docs-check
              strategy_id: momentum
              start: "2026-08-28T01:21:38Z"
              end: "2026-08-28T03:21:38Z"
              interval: 1m
              seed: 42
              starting_cash: 100000
              tickers: [AAPL, MSFT]
      responses:
        "202":
          description: Queued. Note this response carries no `meta`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
