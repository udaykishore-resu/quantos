          $ref: "#/components/responses/Forbidden"
        "404":
          description: The ticker is not in the configured universe.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ErrorBody" }
              example:
                error:
                  code: not_found
                  message: the resource does not exist
                  detail: unknown ticker ZZZZ
                  request_id: 8413fd9c7404d896
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
        "429":
          $ref: "#/components/responses/RateLimited"

  /api/v1/stocks/{ticker}/candles:
    get:
      tags: [market]
      operationId: listCandles
      summary: OHLCV bars for one instrument.
      description: |
        `adjusted` records whether prices are split and dividend adjusted.
        Mixing adjusted and unadjusted series is refused upstream, so every bar
        in one response agrees. `partial` marks a bar whose interval has not
        closed yet.
      parameters:
        - $ref: "#/components/parameters/TickerPath"
        - name: interval
          in: query
          required: false
          description: Bar duration. An unrecognised value falls back to one-minute bars rather than erroring.
          schema:
            $ref: "#/components/schemas/Interval"
          example: 1m
        - $ref: "#/components/parameters/Limit500"
        - $ref: "#/components/parameters/From"
        - $ref: "#/components/parameters/To"
      responses:
        "200":
          description: Bars.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: "#/components/schemas/Envelope"
                  - type: object
                    properties:
                      data:
                        type: [array, "null"]
                        items: { $ref: "#/components/schemas/Candle" }
              example:
                data:
                  - ticker: AAPL
                    interval: 1m
                    open: 230.9207
                    high: 230.9207
                    low: 230.3844
                    close: 230.5058
                    volume: 2160557
                    vwap: 230.7041
                    trades: 59
                    start: "2026-08-28T03:20:00Z"
                    end: "2026-08-28T03:21:00Z"
                    adjusted: true
                    source: sim
                    partial: false
                    seq: 1800556
                meta: { count: 1, limit: 2 }
                disclaimer: >-
                  QuantOS is an educational research and paper-trading platform.
                  Output is probabilistic, may be wrong, and is not financial
                  advice. No real-money orders are placed.
                request_id: c3898487b372990b
                served_at: "2026-08-28T03:21:57.23881944Z"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "503":
          $ref: "#/components/responses/Unavailable"

  /api/v1/news:
    get:
      tags: [market]
      operationId: listNews
      summary: Processed news events.
      description: |
        Only typed fields cross into the decision path; the raw article text
        never does. `sentiment_score`, `materiality_score` and `confidence`
        multiply into a single bounded impact number, which is the only numeric
        channel by which news reaches a prediction.

        `stage` distinguishes `deterministic` classification from
        `llm-enriched`. Deterministic classification always runs first and an
        LLM may only agree or add detail, never overturn it.

